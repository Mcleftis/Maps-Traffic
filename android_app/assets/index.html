<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Διαδρομή χωρίς κίνηση</title>
  <link rel="stylesheet" href="leaflet/leaflet.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #app { display: flex; flex-direction: column; height: 100%; }

    #panel {
      padding: 10px 12px; background: #fff; z-index: 1100;
      box-shadow: 0 2px 6px rgba(0,0,0,.25);
      display: flex; flex-direction: column; gap: 8px;
    }
    .inputwrap { position: relative; }
    .inputwrap input {
      width: 100%; padding: 10px 12px; font-size: 16px;
      border: 1px solid #ccc; border-radius: 6px;
    }
    .suggestions {
      position: absolute; top: 100%; left: 0; right: 0; z-index: 1200;
      background: #fff; border: 1px solid #ddd; border-top: none;
      border-radius: 0 0 6px 6px; max-height: 200px; overflow-y: auto;
      display: none;
    }
    .suggestions div {
      padding: 9px 12px; font-size: 14px; cursor: pointer;
      border-bottom: 1px solid #f0f0f0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .suggestions div:active, .suggestions div:hover { background: #eef3fd; }

    #modes { display: flex; gap: 6px; }
    #modes button {
      flex: 1; padding: 8px; font-size: 18px; border-radius: 6px;
      border: 1px solid #ccc; background: #fff; cursor: pointer;
    }
    #modes button.active { background: #1a73e8; border-color: #1a73e8; }

    #avoidWrap {
      display: flex; align-items: center; gap: 6px; font-size: 12px;
      color: #333; padding: 1px 2px; cursor: pointer;
    }
    #avoidWrap input { width: 15px; height: 15px; flex: none; }
    #avoidWrap.disabled { color: #aaa; cursor: not-allowed; }

    #actions { display: flex; gap: 6px; }
    #actions button {
      padding: 11px; font-size: 15px; font-weight: 600; border: none;
      border-radius: 6px; cursor: pointer; background: #eee; color: #333;
    }
    #go { flex: 1; background: #1a73e8 !important; color: #fff !important; }
    #go:disabled { background: #9cbcf0 !important; }
    #startNav { display: none; flex: 1; background: #188038 !important; color: #fff !important; }

    #result { font-size: 14px; color: #333; min-height: 0; }
    #result .badge {
      display: inline-block; background: #e6f4ea; color: #137333;
      border-radius: 4px; padding: 2px 6px; font-size: 12px;
      font-weight: 600; margin-left: 6px;
    }
    #result .badge.traffic { background: #fef7e0; color: #b06000; }
    #result .alt { color: #666; font-size: 13px; }
    #result .error { color: #c5221f; }
    #routeChoices { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    #routeChoices .rc {
      padding: 6px 10px; font-size: 13px; font-weight: 600; cursor: pointer;
      border: 1px solid #ccc; border-radius: 16px; background: #fff; color: #444;
    }
    #routeChoices .rc.on { background: #1a73e8; border-color: #1a73e8; color: #fff; }

    #stepsToggle {
      display: none; font-size: 13px; font-weight: 600; color: #1a73e8;
      background: none; border: none; text-align: left; cursor: pointer; padding: 0;
    }
    #steps {
      display: none; max-height: 32vh; overflow-y: auto;
      border-top: 1px solid #eee;
    }
    #steps .step {
      display: flex; gap: 10px; align-items: baseline;
      padding: 7px 4px; font-size: 14px; border-bottom: 1px solid #f3f3f3;
    }
    #steps .ico { font-size: 17px; width: 22px; text-align: center; flex: none; }
    #steps .dist { margin-left: auto; color: #888; font-size: 12px; flex: none; }

    #map { flex: 1; position: relative; }

    /* ---- Λειτουργία πλοήγησης ---- */
    #navBanner {
      display: none; position: absolute; top: 10px; left: 10px; right: 10px;
      z-index: 1500; background: #188038; color: #fff; border-radius: 10px;
      padding: 12px 14px; box-shadow: 0 3px 10px rgba(0,0,0,.35);
      align-items: center; gap: 14px;
    }
    #navBanner .bigico { font-size: 34px; flex: none; width: 44px; text-align: center; }
    #navDist { font-size: 22px; font-weight: 700; line-height: 1.1; }
    #navText { font-size: 15px; opacity: .95; }
    #navBottom {
      display: none; position: absolute; left: 10px; right: 10px; bottom: 12px;
      z-index: 1500; background: #fff; border-radius: 10px;
      padding: 10px 12px; box-shadow: 0 3px 10px rgba(0,0,0,.35);
      align-items: center; gap: 8px;
    }
    #navStats { flex: 1; font-size: 15px; }
    #navStats strong { font-size: 17px; }
    #navBottom button {
      border: none; border-radius: 8px; padding: 10px 12px;
      font-size: 17px; cursor: pointer; background: #eee;
    }
    #navStop { background: #fce8e6 !important; color: #c5221f; font-weight: 700; }

    /* ---- Καρτέλες: Κίνηση (TomTom) / Ομάδες (Viber) — συμπαγές ---- */
    #alertsPanel { display: none; border-top: 1px solid #eee; margin-top: 3px; }
    #alertsTabs {
      display: flex; align-items: center; gap: 4px; padding: 3px 0;
    }
    #alertsTabs .tab {
      flex: 1; padding: 5px 4px; font-size: 12px; font-weight: 700;
      border: 1px solid #ddd; border-radius: 6px; background: #f5f5f5;
      color: #666; cursor: pointer;
    }
    #alertsTabs .tab.active { background: #1a73e8; border-color: #1a73e8; color: #fff; }
    #alertsClear { background: none; border: none; font-size: 15px; cursor: pointer; flex: none; padding: 0 2px; }
    #alertsEnable { font-size: 12px; }
    #alertsEnable button {
      width: 100%; padding: 7px; margin: 2px 0 4px; border: none; border-radius: 6px;
      background: #c5221f; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .alist { max-height: 34vh; overflow-y: auto; }
    /* Τηλεγραφικές γραμμές: μικρότερα γράμματα, στενό padding, μονή σειρά. */
    .alist .a {
      display: flex; gap: 6px; align-items: baseline;
      padding: 3px 2px; font-size: 12px; line-height: 1.25;
      border-bottom: 1px solid #f4f4f4; cursor: pointer;
    }
    .alist .a .ai { font-size: 14px; width: 17px; text-align: center; flex: none; }
    .alist .a .am { flex: 1; min-width: 0; }
    .alist .a .am b { font-weight: 600; }
    .alist .a .am .sub {
      color: #999; font-size: 10.5px; display: block;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .alist .a .at { color: #bbb; font-size: 10px; flex: none; }
    .alist .empty { color: #888; font-size: 11.5px; padding: 6px 2px; line-height: 1.4; }
    .alert-pin {
      font-size: 22px; text-align: center; line-height: 1;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.5));
    }
    #alertsBtn.on { background: #c5221f !important; }

    .sat-btn {
      width: 40px; height: 40px; border: none; border-radius: 8px;
      background: #fff; font-size: 20px; cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,.35);
    }
    .sat-btn.on { background: #1a73e8; }

    #recenterBtn {
      display: none; position: absolute; right: 12px; bottom: 78px; z-index: 1600;
      width: 50px; height: 50px; border-radius: 50%; border: none;
      background: #1a73e8; color: #fff; font-size: 24px; cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,.4);
      align-items: center; justify-content: center;
    }

    /* ---- Συμπαγής όψη στο «μικρό παράθυρο» (Picture-in-Picture) ---- */
    body.pip #panel,
    body.pip #navBottom,
    body.pip #recenterBtn,
    body.pip .leaflet-control-container { display: none !important; }
    body.pip #navBanner {
      top: 4px; left: 4px; right: 4px; padding: 6px 8px; gap: 8px; border-radius: 8px;
    }
    body.pip #navBanner .bigico { font-size: 22px; width: 28px; }
    body.pip #navDist { font-size: 15px; }
    body.pip #navText { font-size: 11px; }

    .me-arrow {
      width: 0; height: 0; border-left: 11px solid transparent;
      border-right: 11px solid transparent; border-bottom: 26px solid #1a73e8;
      filter: drop-shadow(0 0 3px rgba(255,255,255,.9));
      transform-origin: 50% 65%;
    }
    .leaflet-popup-content button {
      display: block; width: 100%; margin: 4px 0; padding: 8px 10px;
      border: none; border-radius: 5px; background: #1a73e8; color: #fff;
      font-size: 14px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="panel">
      <div class="inputwrap">
        <input id="origin" type="text" placeholder="Αφετηρία" autocomplete="off">
        <div class="suggestions" id="originSug"></div>
      </div>
      <div class="inputwrap">
        <input id="destination" type="text" placeholder="Προορισμός" autocomplete="off">
        <div class="suggestions" id="destSug"></div>
      </div>
      <div id="modes">
        <button data-mode="car" class="active" title="Αυτοκίνητο">🚗</button>
        <button data-mode="bike" title="Ποδήλατο">🚲</button>
        <button data-mode="foot" title="Περπάτημα">🚶</button>
      </div>
      <label id="avoidWrap">
        <input type="checkbox" id="avoidTraffic" checked>
        <span>🚦 Αποφυγή κίνησης (διαλέγει πιο γρήγορο δρόμο, TomTom)</span>
      </label>
      <div id="actions">
        <button id="go">Διαδρομή</button>
        <button id="startNav">▶ Εκκίνηση</button>
        <button id="swap" title="Αντιστροφή">⇅</button>
        <button id="locate" title="Η θέση μου">📍</button>
        <button id="alertsBtn" title="Ειδοποιήσεις ομάδων">🚨</button>
        <button id="clear" title="Καθαρισμός">✕</button>
      </div>
      <div id="result"></div>
      <button id="stepsToggle">Οδηγίες βήμα-βήμα ▾</button>
      <div id="steps"></div>
      <div id="alertsPanel">
        <div id="alertsTabs">
          <button class="tab active" data-tab="traffic">🚦 Κίνηση</button>
          <button class="tab" data-tab="groups">💬 Ομάδες</button>
          <button id="alertsClear" title="Καθαρισμός">🗑️</button>
        </div>
        <div id="tabTraffic" class="tabpane">
          <div id="trafficList" class="alist"></div>
        </div>
        <div id="tabGroups" class="tabpane" hidden>
          <div id="alertsEnable"></div>
          <div id="groupsList" class="alist"></div>
        </div>
      </div>
    </div>
    <div id="map">
      <div id="navBanner">
        <span class="bigico" id="navIco">↑</span>
        <div>
          <div id="navDist">—</div>
          <div id="navText">Εκκίνηση διαδρομής</div>
        </div>
      </div>
      <div id="navBottom">
        <span id="navStats">—</span>
        <button id="navOverview" title="Επισκόπηση διαδρομής">🗺️</button>
        <button id="navMute" title="Φωνητικές οδηγίες">🔊</button>
        <button id="navStop" title="Τερματισμός">✕</button>
      </div>
      <button id="recenterBtn" title="Επανακέντρο">◎</button>
    </div>
  </div>

  <script src="leaflet/leaflet.js"></script>
  <script>
    // ====================================================================
    // ΔΥΟ πηγές δρομολόγησης, εναλλάξιμες με το checkbox «Αποφυγή κίνησης»:
    //   • OSRM (routing.openstreetmap.de) — στατικό, ΑΓΝΟΕΙ την κίνηση,
    //     χωρίς κλειδί. Προεπιλογή όταν δεν υπάρχει κλειδί TomTom.
    //   • TomTom Routing API (traffic=true) — ΛΑΜΒΑΝΕΙ υπόψη τη ζωντανή
    //     κίνηση και προτείνει διαφορετικό δρόμο αν ο κύριος έχει
    //     μποτιλιάρισμα (μόνο αυτοκίνητο, χρειάζεται το ίδιο κλειδί TomTom
    //     με το traffic overlay/περιστατικά πιο κάτω).
    // Geocoding/autocomplete: Photon + Nominatim (δωρεάν, χωρίς κλειδί).
    // Ζωντανή πλοήγηση: watchPosition + προβολή θέσης πάνω στη διαδρομή.
    // ====================================================================
    const PROFILES = {
      car:  "https://routing.openstreetmap.de/routed-car/route/v1/driving",
      bike: "https://routing.openstreetmap.de/routed-bike/route/v1/driving",
      foot: "https://routing.openstreetmap.de/routed-foot/route/v1/driving",
    };
    const PHOTON = "https://photon.komoot.io/api/";
    const NOMINATIM = "https://nominatim.openstreetmap.org";

    // ====================================================================
    // ΖΩΝΤΑΝΗ ΚΙΝΗΣΗ — TomTom Traffic Flow tiles.
    // Δεν υπάρχει ΚΑΝΕΝΑ δωρεάν, χωρίς-κλειδί, παγκόσμιο traffic layer:
    // τα δεδομένα κίνησης τα μαζεύουν εταιρείες και θέλουν API key.
    // Το TomTom δίνει ΔΩΡΕΑΝ κλειδί, ΧΩΡΙΣ πιστωτική κάρτα, εδώ:
    //   https://developer.tomtom.com/  →  Register  →  My Dashboard  →  Keys
    // Κόλλα το κλειδί σου εδώ και η κίνηση εμφανίζεται παντού:
    const TRAFFIC_KEY = "SzHkHNIFayLI04Duc0XGzFRtFTTryBlj";

    // ---- Χάρτης + layers -----------------------------------------------
    // Τοπικά εικονίδια δεικτών (bundled Leaflet — χωρίς CDN).
    L.Icon.Default.imagePath = "leaflet/images/";
    // preferCanvas: σχεδίαση διαδρομής/δεικτών σε canvas (πιο γρήγορο render).
    const map = L.map("map", { zoomControl: true, preferCanvas: true }).setView([38.0, 23.7], 7);
    const osmLayer = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    }).addTo(map);
    const satLayer = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 19, attribution: "Tiles &copy; Esri",
    });

    // Traffic overlay (πάνω από τον χάρτη): κόκκινο=μποτιλιάρισμα, πράσινο=ελεύθερα.
    const trafficReady = TRAFFIC_KEY && TRAFFIC_KEY.indexOf("YOUR_") !== 0;
    const trafficLayer = L.tileLayer(
      "https://api.tomtom.com/traffic/map/4/tile/flow/relative0/{z}/{x}/{y}.png?key=" + TRAFFIC_KEY,
      { maxZoom: 22, opacity: 0.85, zIndex: 400,
        attribution: 'Κίνηση &copy; <a href="https://www.tomtom.com">TomTom</a>' }
    );

    // Overlay: η ίδια η ΔΙΑΔΡΟΜΗ χρωματισμένη με την κίνηση (σαν Google Maps).
    const trafficRouteLayer = L.layerGroup();
    const flowCache = {};

    // Χωρίς κουτιά ελέγχου: η κίνηση είναι ΠΑΝΤΑ ενεργή (αν υπάρχει κλειδί).
    if (trafficReady) trafficLayer.addTo(map);
    L.control.scale({ metric: true, imperial: false }).addTo(map);

    // Μικρό κουμπί εναλλαγής Χάρτης/Δορυφόρος (αντί για ολόκληρο πάνελ).
    let satOn = false;
    const satBtn = L.control({ position: "topright" });
    satBtn.onAdd = () => {
      const b = L.DomUtil.create("button", "sat-btn");
      b.innerHTML = "🛰️";
      b.title = "Δορυφόρος / Χάρτης";
      L.DomEvent.disableClickPropagation(b);
      b.onclick = () => {
        satOn = !satOn;
        if (satOn) { osmLayer.remove(); satLayer.addTo(map); }
        else { satLayer.remove(); osmLayer.addTo(map); }
        if (trafficReady) trafficLayer.bringToFront();
        b.classList.toggle("on", satOn);
      };
      return b;
    };
    satBtn.addTo(map);

    // Λόγος currentSpeed/freeFlowSpeed σε ένα σημείο → χρώμα κίνησης.
    async function flowRatio(lat, lon) {
      const key = lat.toFixed(3) + "," + lon.toFixed(3);
      if (key in flowCache) return flowCache[key];
      try {
        const url = "https://api.tomtom.com/traffic/services/4/flowSegmentData/" +
          `relative0/10/json?key=${TRAFFIC_KEY}&point=${lat},${lon}`;
        const d = await (await fetch(url)).json();
        const f = d.flowSegmentData;
        const r = f && f.freeFlowSpeed ? f.currentSpeed / f.freeFlowSpeed : 1;
        flowCache[key] = r;
        return r;
      } catch (e) { return 1; }
    }
    function ratioColor(r) {
      if (r >= 0.85) return "#1a73e8";   // ελεύθερα → μπλε (όπως Google)
      if (r >= 0.6) return "#f59f00";    // πυκνή → πορτοκαλί
      return "#e03131";                  // μποτιλιάρισμα → κόκκινο
    }
    // Παραλληλία ΜΕ ΟΡΙΟ ταυτόχρονων (σεβασμός στο QPS του TomTom).
    async function mapLimit(items, limit, fn) {
      const out = new Array(items.length);
      let idx = 0;
      async function worker() {
        while (idx < items.length) { const i = idx++; out[i] = await fn(items[i], i); }
      }
      await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
      return out;
    }
    // Χρωματίζει τη διαδρομή: δειγματοληψία κίνησης ανά ~2.5km και ομαδοποίηση.
    // Δειγματοληψία κίνησης κατά μήκος → χρώμα ΑΝΑ ΤΜΗΜΑ (segment).
    // ll=[[lat,lon]...], cum=αθροιστικές αποστάσεις. Επιστρέφει colors[] μήκους ll.length-1.
    async function computeSegColors(ll, cum) {
      if (!trafficReady || ll.length < 2) return null;
      const total = cum[cum.length - 1], STEP = 2500, MAX = 24;
      const step = Math.max(STEP, total / MAX);
      const samples = [];
      for (let d = 0; d <= total; d += step) {
        let i = 0; while (i < cum.length - 1 && cum[i] < d) i++;
        samples.push({ lat: ll[i][0], lon: ll[i][1] });
      }
      const ratios = await mapLimit(samples, 4, s => flowRatio(s.lat, s.lon));
      const colors = [];
      for (let i = 1; i < ll.length; i++) {
        const mid = (cum[i - 1] + cum[i]) / 2;
        const si = Math.min(ratios.length - 1, Math.max(0, Math.round(mid / step)));
        colors.push(ratioColor(ratios[si] != null ? ratios[si] : 1));
      }
      return colors;
    }

    // Ζωγραφίζει ομαδοποιημένα χρωματιστά τμήματα (ίδια χρώματα → μία γραμμή).
    function paintSegments(pts, colors, layer) {
      layer.clearLayers();
      let start = 0;
      for (let i = 1; i <= colors.length; i++) {
        if (i === colors.length || colors[i] !== colors[start]) {
          L.polyline(pts.slice(start, i + 1),
            { color: colors[start], weight: 7, opacity: 0.95 }).addTo(layer);
          start = i;
        }
      }
      layer.addTo(map);
    }

    // Χρωματισμός ΟΛΟΚΛΗΡΗΣ διαδρομής (προβολή σχεδιασμού, πριν την πλοήγηση).
    async function colorRouteByTraffic(route) {
      trafficRouteLayer.clearLayers();
      if (!trafficReady || !route) { map.removeLayer(trafficRouteLayer); return; }
      const ll = route.geometry.coordinates.map(([lon, lat]) => [lat, lon]);
      if (ll.length < 2) return;
      const cum = [0];
      for (let i = 1; i < ll.length; i++) cum.push(cum[i - 1] + havDist(ll[i - 1], ll[i]));
      const colors = await computeSegColors(ll, cum);
      if (!colors) { map.removeLayer(trafficRouteLayer); return; }
      paintSegments(ll, colors, trafficRouteLayer);
    }

    // ---- Κατάσταση -------------------------------------------------------
    let origin = null, dest = null;      // {lat, lon}
    let markerA = null, markerB = null, myPosMarker = null;
    let routeLines = [];                 // [{line, route}]
    let activeIdx = 0;
    let mode = "car";
    let followMode = true, suppressAutoUntil = 0;

    const $ = id => document.getElementById(id);
    const resultEl = $("result"), stepsEl = $("steps"), stepsToggle = $("stepsToggle");

    // ---- Autocomplete (Photon) ------------------------------------------
    function attachAutocomplete(inputId, sugId, setPoint, showMyLoc) {
      const input = $(inputId), sug = $(sugId);
      let timer = null;
      // «📍 Η θέση μου» ως πρώτη επιλογή όταν το πεδίο αφετηρίας είναι άδειο.
      function showMyLocationOption() {
        if (!showMyLoc || input.value.trim() !== "") return;
        sug.innerHTML = "";
        const div = document.createElement("div");
        div.innerHTML = "📍 <b>Η θέση μου</b>";
        div.onclick = () => { sug.style.display = "none"; useMyLocation(); };
        sug.appendChild(div);
        sug.style.display = "block";
      }
      input.addEventListener("focus", showMyLocationOption);
      input.addEventListener("input", () => {
        setPoint(null);                  // ο χρήστης αλλάζει το κείμενο
        clearTimeout(timer);
        const q = input.value.trim();
        if (q === "") { showMyLocationOption(); return; }
        if (q.length < 3) { sug.style.display = "none"; return; }
        timer = setTimeout(async () => {
          try {
            const c = map.getCenter();
            const url = `${PHOTON}?q=${encodeURIComponent(q)}&limit=5&lat=${c.lat}&lon=${c.lng}`;
            const results = (await (await fetch(url)).json()).features || [];
            sug.innerHTML = "";
            results.forEach(f => {
              const p = f.properties;
              const label = [p.name, p.street, p.city || p.county, p.country]
                .filter(Boolean).filter((v, i, a) => a.indexOf(v) === i).join(", ");
              const div = document.createElement("div");
              div.textContent = label;
              div.onclick = () => {
                input.value = label;
                sug.style.display = "none";
                const [lon, lat] = f.geometry.coordinates;
                setPoint({ lat, lon });
                maybeRoute();
              };
              sug.appendChild(div);
            });
            sug.style.display = results.length ? "block" : "none";
          } catch (e) { sug.style.display = "none"; }
        }, 300);
      });
      input.addEventListener("keydown", e => {
        if (e.key === "Enter") { sug.style.display = "none"; calculateRoute(); }
      });
      document.addEventListener("click", e => {
        if (!sug.contains(e.target) && e.target !== input) sug.style.display = "none";
      });
    }
    attachAutocomplete("origin", "originSug", p => { origin = p; if (p) placeMarker("A", p); }, true);
    attachAutocomplete("destination", "destSug", p => { dest = p; if (p) placeMarker("B", p); });

    // ---- Geocoding fallback / reverse -----------------------------------
    const geoCache = {};                  // cache: ίδια διεύθυνση → όχι ξανά δίκτυο
    async function geocode(query) {
      const key = query.trim().toLowerCase();
      if (geoCache[key]) return geoCache[key];
      const url = `${NOMINATIM}/search?format=json&limit=1&q=${encodeURIComponent(query)}`;
      const results = await (await fetch(url, { headers: { "Accept-Language": "el,en" } })).json();
      if (!results.length) throw new Error(`Δεν βρέθηκε: «${query}»`);
      const r = { lat: +results[0].lat, lon: +results[0].lon };
      geoCache[key] = r;
      return r;
    }
    async function reverseName(p) {
      try {
        const url = `${NOMINATIM}/reverse?format=json&lat=${p.lat}&lon=${p.lon}&zoom=17`;
        const r = await (await fetch(url, { headers: { "Accept-Language": "el,en" } })).json();
        return r.display_name ? r.display_name.split(",").slice(0, 3).join(",") : `${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}`;
      } catch (e) { return `${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}`; }
    }

    // ---- Δείκτες (συρόμενοι) --------------------------------------------
    function placeMarker(which, p) {
      const isA = which === "A";
      let m = isA ? markerA : markerB;
      if (m) { m.setLatLng([p.lat, p.lon]); return; }
      m = L.marker([p.lat, p.lon], { draggable: true, title: isA ? "Αφετηρία" : "Προορισμός" }).addTo(map);
      m.bindTooltip(isA ? "A" : "B", { permanent: true, direction: "top", offset: [-14, -10] });
      m.on("dragend", async () => {
        const ll = m.getLatLng();
        const p2 = { lat: ll.lat, lon: ll.lng };
        if (isA) origin = p2; else dest = p2;
        $(isA ? "origin" : "destination").value = await reverseName(p2);
        maybeRoute();
      });
      if (isA) markerA = m; else markerB = m;
    }

    // ---- Πάτημα στον χάρτη → ορισμός σημείου ----------------------------
    map.on("click", e => {
      if (nav.active) return;            // όχι popup κατά την πλοήγηση
      const { lat, lng } = e.latlng;
      const html =
        `<button onclick="setPointHere('A',${lat},${lng})">Αφετηρία εδώ</button>` +
        `<button onclick="setPointHere('B',${lat},${lng})">Προορισμός εδώ</button>`;
      L.popup().setLatLng(e.latlng).setContent(html).openOn(map);
    });
    window.setPointHere = async (which, lat, lon) => {
      map.closePopup();
      const p = { lat, lon };
      if (which === "A") origin = p; else dest = p;
      placeMarker(which, p);
      $(which === "A" ? "origin" : "destination").value = await reverseName(p);
      maybeRoute();
    };

    // ---- Η θέση μου ------------------------------------------------------
    // Ορίζει την τρέχουσα θέση GPS ως αφετηρία (κουμπί 📍 ή επιλογή στη λίστα).
    function useMyLocation() {
      if (!navigator.geolocation) {
        resultEl.innerHTML = '<span class="error">Δεν υποστηρίζεται εντοπισμός θέσης.</span>';
        return;
      }
      resultEl.textContent = "Εντοπισμός θέσης…";
      navigator.geolocation.getCurrentPosition(pos => {
        const p = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        origin = p;
        placeMarker("A", p);
        $("origin").value = "Η θέση μου";
        map.setView([p.lat, p.lon], Math.max(map.getZoom(), 14));
        resultEl.textContent = "";
        maybeRoute();
      }, err => {
        resultEl.innerHTML = `<span class="error">Αποτυχία εντοπισμού: ${err.message}</span>`;
      }, { enableHighAccuracy: true, timeout: 15000 });
    }
    $("locate").addEventListener("click", useMyLocation);

    // ---- Λειτουργίες μετακίνησης ----------------------------------------
    // Το checkbox «Αποφυγή κίνησης» δουλεύει μόνο με αυτοκίνητο + κλειδί TomTom.
    function updateAvoidToggle() {
      const wrap = $("avoidWrap"), cb = $("avoidTraffic");
      const eligible = trafficReady && mode === "car";
      cb.disabled = !eligible;
      wrap.classList.toggle("disabled", !eligible);
      wrap.title = !trafficReady ? "Χρειάζεται κλειδί TomTom."
        : mode !== "car" ? "Διαθέσιμο μόνο για αυτοκίνητο." : "";
      if (!eligible) cb.checked = false;
      else if (!wrap.dataset.touched) cb.checked = true;   // προεπιλογή ON
    }
    $("avoidTraffic").addEventListener("change", () => { $("avoidWrap").dataset.touched = "1"; });
    updateAvoidToggle();

    document.querySelectorAll("#modes button").forEach(b => {
      b.addEventListener("click", () => {
        document.querySelectorAll("#modes button").forEach(x => x.classList.remove("active"));
        b.classList.add("active");
        mode = b.dataset.mode;
        updateAvoidToggle();
        maybeRoute();
      });
    });

    // ---- Λοιπά κουμπιά ---------------------------------------------------
    $("swap").addEventListener("click", () => {
      [origin, dest] = [dest, origin];
      const a = $("origin").value; $("origin").value = $("destination").value; $("destination").value = a;
      if (origin) placeMarker("A", origin);
      if (dest) placeMarker("B", dest);
      maybeRoute();
    });
    $("clear").addEventListener("click", () => {
      stopNavigation();
      origin = dest = null;
      $("origin").value = $("destination").value = "";
      [markerA, markerB, myPosMarker].forEach(m => m && m.remove());
      markerA = markerB = myPosMarker = null;
      clearRoutes();
      trafficRouteLayer.clearLayers(); map.removeLayer(trafficRouteLayer);
      resultEl.textContent = "";
      $("startNav").style.display = "none";
      stepsEl.style.display = "none"; stepsToggle.style.display = "none";
    });
    $("go").addEventListener("click", calculateRoute);
    stepsToggle.addEventListener("click", () => {
      const open = stepsEl.style.display === "block";
      stepsEl.style.display = open ? "none" : "block";
      stepsToggle.textContent = open ? "Οδηγίες βήμα-βήμα ▾" : "Οδηγίες βήμα-βήμα ▴";
    });

    // ====================================================================
    // ΑΠΟΦΥΓΗ ΚΙΝΗΣΗΣ — δρομολόγηση με το TomTom Routing API (traffic=true).
    // Σε αντίθεση με το OSRM πιο πάνω (στατικό, ΠΟΤΕ δεν βλέπει κίνηση), το
    // TomTom υπολογίζει τη διαδρομή ΛΑΜΒΑΝΟΝΤΑΣ ΥΠΟΨΗ τη ζωντανή κίνηση —
    // αν ο κύριος δρόμος έχει μποτιλιάρισμα, προτείνει άλλον. Ίδιο κλειδί
    // με το traffic overlay/περιστατικά παραπάνω.
    // ====================================================================
    const TT_TRAVEL_MODE = { car: "car", bike: "bicycle", foot: "pedestrian" };

    // Κωδικοί ελιγμών TomTom → [type, modifier] στο ίδιο λεξιλόγιο που ήδη
    // καταλαβαίνει το stepInfo() (χτισμένο πάνω στο λεξιλόγιο του OSRM),
    // ώστε οι οδηγίες/η πλοήγηση να δουλεύουν αμετάβλητες και για τις δύο πηγές.
    const TT_MANEUVER = {
      DEPART: ["depart", null], ARRIVE: ["arrive", null],
      ARRIVE_LEFT: ["arrive", null], ARRIVE_RIGHT: ["arrive", null],
      STRAIGHT: ["turn", "straight"], CONTINUE: ["turn", "straight"],
      TURN_LEFT: ["turn", "left"], TURN_RIGHT: ["turn", "right"],
      SHARP_LEFT: ["turn", "sharp left"], SHARP_RIGHT: ["turn", "sharp right"],
      BEAR_LEFT: ["turn", "slight left"], BEAR_RIGHT: ["turn", "slight right"],
      KEEP_LEFT: ["turn", "slight left"], KEEP_RIGHT: ["turn", "slight right"],
      UTURN_LEFT: ["turn", "uturn"], UTURN_RIGHT: ["turn", "uturn"],
      ROUNDABOUT_CROSS: ["roundabout", null], ROUNDABOUT_LEFT: ["roundabout", null],
      ROUNDABOUT_RIGHT: ["roundabout", null], ROUNDABOUT_BACK: ["roundabout", null],
      MERGE: ["merge", null], MOTORWAY_ENTER: ["on ramp", null],
      MOTORWAY_EXIT_LEFT: ["off ramp", "left"], MOTORWAY_EXIT_RIGHT: ["off ramp", "right"],
      MOTORWAY_EXIT: ["off ramp", null],
      FORK_LEFT: ["fork", "left"], FORK_RIGHT: ["fork", "right"],
      END_OF_ROAD_LEFT: ["end of road", "left"], END_OF_ROAD_RIGHT: ["end of road", "right"],
    };

    // Μετατρέπει μια διαδρομή TomTom στην ΙΔΙΑ δομή που παράγει το OSRM
    // (geometry.coordinates [lon,lat], distance, duration, legs[].steps[])
    // — έτσι drawRoutes/buildNavData/renderSteps/colorRouteByTraffic τη
    // χρησιμοποιούν χωρίς καμία αλλαγή, όποια πηγή κι αν την έφτιαξε.
    function ttAdaptRoute(route) {
      const legPts = (route.legs || []).flatMap(l => l.points || []);
      const coordinates = legPts.map(p => [p.longitude, p.latitude]);
      const instr = (route.guidance && route.guidance.instructions) || [];
      const steps = instr.map((ins, i) => {
        const [type, modifier] = TT_MANEUVER[ins.maneuver] || ["turn", "straight"];
        const next = instr[i + 1];
        const dist = next
          ? Math.max(0, (next.routeOffsetInMeters || 0) - (ins.routeOffsetInMeters || 0)) : 0;
        const step = {
          name: ins.street || (ins.roadNumbers && ins.roadNumbers[0]) || "",
          distance: dist,
          maneuver: { type, modifier, location: [ins.point.longitude, ins.point.latitude] },
        };
        if (ins.roundaboutExitNumber) step.maneuver.exit = ins.roundaboutExitNumber;
        return step;
      });
      return {
        geometry: { coordinates },
        distance: route.summary.lengthInMeters,
        duration: route.summary.travelTimeInSeconds,
        legs: [{ steps }],
        __source: "tomtom",
        __trafficDelay: route.summary.trafficDelayInSeconds || 0,
      };
    }

    async function fetchTomTomRoutes(o, d, tmode) {
      const travelMode = TT_TRAVEL_MODE[tmode] || "car";
      const url = "https://api.tomtom.com/routing/1/calculateRoute/" +
        `${o.lat},${o.lon}:${d.lat},${d.lon}/json` +
        `?key=${TRAFFIC_KEY}&traffic=true&routeType=fastest&travelMode=${travelMode}` +
        `&instructionsType=coded&language=el-GR` +
        `&maxAlternatives=${nav.active ? 0 : 2}`;
      const resp = await fetch(url);
      if (!resp.ok) throw new Error("TomTom HTTP " + resp.status);
      const data = await resp.json();
      if (!data.routes || !data.routes.length) throw new Error("Δεν βρέθηκε διαδρομή (TomTom).");
      return data.routes.map(ttAdaptRoute);
    }

    async function fetchOSRMRoutes(o, d, tmode) {
      const url = `${PROFILES[tmode]}/${o.lon},${o.lat};${d.lon},${d.lat}` +
        `?overview=full&geometries=geojson&alternatives=${nav.active ? "false" : "true"}&steps=true`;
      const data = await (await fetch(url)).json();
      if (data.code !== "Ok" || !data.routes.length)
        throw new Error("Δεν βρέθηκε διαδρομή μεταξύ αυτών των σημείων.");
      data.routes.forEach(r => { r.__source = "osrm"; });
      return data.routes;
    }

    // ---- Υπολογισμός διαδρομής ------------------------------------------
    function maybeRoute() { if (origin && dest) calculateRoute(); }

    function clearRoutes() {
      routeLines.forEach(r => { r.line.remove(); if (r.hit) r.hit.remove(); });
      routeLines = [];
    }

    async function calculateRoute() {
      try {
        if (!origin) {
          const q = $("origin").value.trim();
          if (!q) throw new Error("Συμπλήρωσε αφετηρία.");
          origin = await geocode(q); placeMarker("A", origin);
        }
        if (!dest) {
          const q = $("destination").value.trim();
          if (!q) throw new Error("Συμπλήρωσε προορισμό.");
          dest = await geocode(q); placeMarker("B", dest);
        }
      } catch (e) {
        resultEl.innerHTML = `<span class="error">${e.message}</span>`;
        return;
      }

      $("go").disabled = true;
      if (!nav.active) resultEl.textContent = "Υπολογισμός…";
      const useTomTom = $("avoidTraffic").checked && trafficReady && mode === "car";
      try {
        let routes;
        if (useTomTom) {
          try {
            routes = await fetchTomTomRoutes(origin, dest, mode);
          } catch (e) {
            // Το TomTom απέτυχε (δίκτυο/όριο) → μη μείνει ο χρήστης χωρίς
            // διαδρομή, γύρνα αθόρυβα στο στατικό OSRM.
            routes = await fetchOSRMRoutes(origin, dest, mode);
          }
        } else {
          routes = await fetchOSRMRoutes(origin, dest, mode);
        }
        await drawRoutes(routes);
      } catch (e) {
        resultEl.innerHTML = `<span class="error">Σφάλμα: ${e.message}</span>`;
      } finally {
        $("go").disabled = false;
      }
    }

    async function drawRoutes(routes) {
      clearRoutes();
      routes.forEach((route, i) => {
        const latlngs = route.geometry.coordinates.map(([lon, lat]) => [lat, lon]);
        // Αόρατη «ζώνη κλικ» — πατιέται πιο εύκολα χωρίς φουλ ζουμ (τα κουμπιά
        // επιλογής παραμένουν ο κύριος, σίγουρος τρόπος).
        const hit = L.polyline(latlngs, { color: "#000", weight: 18, opacity: 0 }).addTo(map);
        hit.on("click", () => { if (!nav.active) selectRoute(i); });
        const line = L.polyline(latlngs, i === 0
          ? { color: "#1a73e8", weight: 6, opacity: 0.95 }
          : { color: "#9aa0a6", weight: 5, opacity: 0.8, dashArray: "6 8" }
        ).addTo(map);
        line.on("click", () => { if (!nav.active) selectRoute(i); });
        routeLines.push({ line, hit, route });
      });
      routeLines[0].line.bringToFront();
      activeIdx = 0;
      if (nav.active) {
        // Επαναϋπολογισμός εν κινήσει: νέα δεδομένα πλοήγησης, χωρίς fitBounds.
        await buildNavData(routeLines[0].route);
        refreshNavColors(true);          // νέα χρώματα κίνησης για τη νέα διαδρομή
      } else {
        map.fitBounds(routeLines[0].line.getBounds(), { padding: [40, 40] });
        showRouteInfo(0);
        $("startNav").style.display = "block";
        colorRouteByTraffic(routeLines[0].route);   // χρωμάτισε με την κίνηση
      }
    }

    function selectRoute(idx) {
      activeIdx = idx;
      routeLines.forEach(({ line }, i) => {
        line.setStyle(i === idx
          ? { color: "#1a73e8", weight: 6, opacity: 0.95, dashArray: null }
          : { color: "#9aa0a6", weight: 5, opacity: 0.8, dashArray: "6 8" });
      });
      routeLines[idx].line.bringToFront();
      showRouteInfo(idx);
      colorRouteByTraffic(routeLines[idx].route);   // χρωμάτισε την επιλεγμένη
    }

    function fmtDist(m) { return m >= 1000 ? (m / 1000).toFixed(1) + " km" : Math.round(m) + " m"; }
    function fmtDur(sec) {
      const min = Math.round(sec / 60), h = Math.floor(min / 60);
      return h > 0 ? `${h} ώρ ${min % 60} λεπ` : `${min} λεπ`;
    }

    function showRouteInfo(idx) {
      const { route } = routeLines[idx];
      const badge = route.__source === "tomtom"
        ? `<span class="badge traffic">🚦 αποφυγή κίνησης` +
          (route.__trafficDelay > 60 ? ` (+${Math.round(route.__trafficDelay / 60)}′ λόγω κίνησης)` : "") +
          `</span>`
        : `<span class="badge">χωρίς δεδομένα κίνησης</span>`;
      let html = `<strong>${fmtDist(route.distance)}</strong> · ${fmtDur(route.duration)}` + badge;
      if (routeLines.length > 1) {
        // Κουμπιά επιλογής διαδρομής — απλό άγγιγμα, χωρίς ζουμ στη γραμμή.
        const fastest = Math.min(...routeLines.map(r => r.route.duration));
        html += '<div id="routeChoices">' + routeLines.map((r, i) => {
          const dur = Math.round(r.route.duration / 60);
          const extra = r.route.duration - fastest;
          const tag = i === 0 ? "Κύρια" : "Εναλλ. " + i;
          const diff = extra < 30 ? "" : ` +${Math.round(extra / 60)}′`;
          return `<button class="rc${i === idx ? " on" : ""}" onclick="selectRoute(${i})">` +
                 `${tag} · ${dur}′${diff}</button>`;
        }).join("") + "</div>";
      }
      resultEl.innerHTML = html;
      renderSteps(route);
    }

    // ---- Οδηγίες βήμα-βήμα στα ελληνικά ---------------------------------
    const DIR_TEXT = {
      "uturn": "Κάνε αναστροφή", "sharp left": "Στρίψε κλειστά αριστερά",
      "left": "Στρίψε αριστερά", "slight left": "Κράτα ελαφρώς αριστερά",
      "straight": "Συνέχισε ευθεία", "slight right": "Κράτα ελαφρώς δεξιά",
      "right": "Στρίψε δεξιά", "sharp right": "Στρίψε κλειστά δεξιά",
    };
    const DIR_ICON = {
      "uturn": "↩", "sharp left": "↰", "left": "←", "slight left": "↖",
      "straight": "↑", "slight right": "↗", "right": "→", "sharp right": "↱",
    };
    function stepInfo(step) {
      const t = step.maneuver.type, m = step.maneuver.modifier || "straight";
      const road = step.name ? ` στην «${step.name}»` : "";
      if (t === "depart") return ["●", "Ξεκίνησε" + road];
      if (t === "arrive") return ["🏁", "Έφτασες στον προορισμό"];
      if (t === "roundabout" || t === "rotary") {
        const exit = step.maneuver.exit ? `πάρε την ${step.maneuver.exit}η έξοδο` : "συνέχισε";
        return ["⟳", `Στον κυκλικό κόμβο ${exit}` + road];
      }
      if (t === "merge") return [DIR_ICON[m] || "↑", "Συγχωνεύσου με τη ροή" + road];
      if (t === "on ramp") return [DIR_ICON[m] || "↗", "Μπες στη ράμπα" + road];
      if (t === "off ramp") return [DIR_ICON[m] || "↘", "Βγες στην έξοδο" + road];
      if (t === "fork") return [DIR_ICON[m] || "↑", `Στη διχάλα ${DIR_TEXT[m] ? DIR_TEXT[m].toLowerCase() : "συνέχισε"}` + road];
      if (t === "end of road") return [DIR_ICON[m] || "↑", `Στο τέλος του δρόμου ${DIR_TEXT[m] ? DIR_TEXT[m].toLowerCase() : "συνέχισε"}`];
      return [DIR_ICON[m] || "↑", (DIR_TEXT[m] || "Συνέχισε") + road];
    }
    function renderSteps(route) {
      stepsEl.innerHTML = "";
      const steps = (route.legs || []).flatMap(l => l.steps || []);
      if (!steps.length) { stepsToggle.style.display = "none"; stepsEl.style.display = "none"; return; }
      steps.forEach(s => {
        const [ico, text] = stepInfo(s);
        const div = document.createElement("div");
        div.className = "step";
        div.innerHTML = `<span class="ico">${ico}</span><span>${text}</span>` +
          (s.distance > 0 ? `<span class="dist">${fmtDist(s.distance)}</span>` : "");
        div.onclick = () => {
          map.setView([s.maneuver.location[1], s.maneuver.location[0]], 16);
        };
        stepsEl.appendChild(div);
      });
      stepsToggle.style.display = "block";
      stepsToggle.textContent = "Οδηγίες βήμα-βήμα ▾";
    }

    // ====================================================================
    // ΖΩΝΤΑΝΗ ΠΛΟΗΓΗΣΗ
    // ====================================================================
    const nav = {
      active: false, watchId: null, muted: false, firstFix: false,
      pts: [], cum: [], mans: [], total: 0, duration: 0,
      lastPos: null, offCount: 0, recalcing: false, snapIdx: 0,
      segColors: null, lastAlong: 0, lastColorRefresh: 0,   // χρώματα κίνησης εν κινήσει
      announced: {},                     // ανά ελιγμό: 1=προαναγγέλθηκε, 2=τελική
    };

    // ---- Follow mode: ο χάρτης ακολουθεί, αλλά ξεκλειδώνει αν ο χρήστης
    //      μετακινήσει/ζουμάρει μόνος του (όπως στο Google Maps) ----------
    function setFollow(on) {
      followMode = on;
      $("recenterBtn").style.display = on ? "none" : "flex";
    }
    function recenterMap(p, zoom) {
      // Παράθυρο 800ms όπου οι δικές μας κινήσεις ΔΕΝ μετρούν ως χρήστης
      // (πιο αξιόπιστο από flag που καθαρίζει το moveend σε συνεχή animations).
      suppressAutoUntil = Date.now() + 800;
      map.setView(p, zoom != null ? zoom : map.getZoom(),
        { animate: true, duration: 0.5 });
    }
    // Μόνο πραγματικές χειρονομίες (σύρσιμο/pinch) ξεκλειδώνουν το follow.
    map.on("dragstart", () => { if (nav.active && Date.now() > suppressAutoUntil) setFollow(false); });
    map.on("zoomstart", () => { if (nav.active && Date.now() > suppressAutoUntil) setFollow(false); });
    // Αλλαγή μεγέθους (PiP, περιστροφή, πληκτρολόγιο) → ενημέρωσε τον χάρτη
    // και κράτα τον κεντραρισμένο στη θέση μας αν είμαστε σε follow.
    window.addEventListener("resize", () => {
      map.invalidateSize();
      if (nav.active && followMode && nav.lastPos) recenterMap(nav.lastPos);
    });
    $("recenterBtn").addEventListener("click", () => {
      setFollow(true);
      if (nav.lastPos) recenterMap(nav.lastPos, 16);
    });
    $("navOverview").addEventListener("click", () => {
      if (!routeLines.length) return;
      setFollow(false);                  // δείξε όλη τη διαδρομή, μείνε ελεύθερος
      suppressAutoUntil = Date.now() + 800;
      map.fitBounds(routeLines[0].line.getBounds(), { padding: [50, 50] });
    });

    const toRad = d => d * Math.PI / 180;
    function havDist(a, b) {             // [lat,lon] ζεύγη → μέτρα
      const R = 6371000;
      const dLat = toRad(b[0] - a[0]), dLon = toRad(b[1] - a[1]);
      const s = Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(a[0])) * Math.cos(toRad(b[0])) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(s));
    }
    function bearing(a, b) {
      const y = Math.sin(toRad(b[1] - a[1])) * Math.cos(toRad(b[0]));
      const x = Math.cos(toRad(a[0])) * Math.sin(toRad(b[0])) -
        Math.sin(toRad(a[0])) * Math.cos(toRad(b[0])) * Math.cos(toRad(b[1] - a[1]));
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    // ---- ΝΗΜΑ ΠΑΡΑΣΚΗΝΙΟΥ (Web Worker) -------------------------------
    // Το «HPC» για WebView: η βαριά γεωμετρία διαδρομής (αθροιστικές
    // αποστάσεις + αντιστοίχιση ελιγμών, O(σημεία×ελιγμοί)) τρέχει σε
    // ξεχωριστό νήμα ώστε το UI να μη «παγώνει» σε μεγάλες διαδρομές.
    // Fallback σε synchronous αν ο browser/WebView δεν επιτρέπει Worker.
    let navWorker = null;
    try {
      const workerSrc =
        'var R=6371000;function tr(d){return d*Math.PI/180;}' +
        'function hav(a,b){var x=tr(b[0]-a[0]),y=tr(b[1]-a[1]);' +
        'var s=Math.sin(x/2)*Math.sin(x/2)+Math.cos(tr(a[0]))*Math.cos(tr(b[0]))*Math.sin(y/2)*Math.sin(y/2);' +
        'return 2*R*Math.asin(Math.sqrt(s));}' +
        'self.onmessage=function(e){var coords=e.data.coords,steps=e.data.steps;' +
        'var pts=coords.map(function(c){return [c[1],c[0]];});' +
        'var cum=[0];for(var i=1;i<pts.length;i++)cum.push(cum[i-1]+hav(pts[i-1],pts[i]));' +
        'var total=cum.length?cum[cum.length-1]:0;' +
        'var mans=steps.map(function(s){var ml=[s.maneuver.location[1],s.maneuver.location[0]];' +
        'var best=0,bd=Infinity;for(var i=0;i<pts.length;i++){var d=hav(pts[i],ml);if(d<bd){bd=d;best=i;}}' +
        'return {step:s,at:cum[best]||0};});' +
        'self.postMessage({pts:pts,cum:cum,total:total,mans:mans});};';
      navWorker = new Worker(URL.createObjectURL(
        new Blob([workerSrc], { type: "application/javascript" })));
    } catch (e) { navWorker = null; }

    function buildNavDataSync(route) {
      nav.pts = route.geometry.coordinates.map(([lon, lat]) => [lat, lon]);
      nav.cum = [0];
      for (let i = 1; i < nav.pts.length; i++)
        nav.cum.push(nav.cum[i - 1] + havDist(nav.pts[i - 1], nav.pts[i]));
      nav.total = nav.cum[nav.cum.length - 1] || 0;
      const steps = (route.legs || []).flatMap(l => l.steps || []);
      nav.mans = steps.map(s => {
        const ml = [s.maneuver.location[1], s.maneuver.location[0]];
        let best = 0, bd = Infinity;
        for (let i = 0; i < nav.pts.length; i++) {
          const d = havDist(nav.pts[i], ml);
          if (d < bd) { bd = d; best = i; }
        }
        return { step: s, at: nav.cum[best] || 0 };
      });
    }

    // Επιστρέφει Promise· ενημερώνει nav.* όταν ολοκληρωθεί ο υπολογισμός.
    function buildNavData(route) {
      nav.duration = route.duration;
      const done = () => { nav.announced = {}; nav.offCount = 0; nav.snapIdx = 0; };
      return new Promise(resolve => {
        if (!navWorker) { buildNavDataSync(route); done(); resolve(); return; }
        const onmsg = e => {
          navWorker.removeEventListener("message", onmsg);
          navWorker.removeEventListener("error", onerr);
          nav.pts = e.data.pts; nav.cum = e.data.cum;
          nav.total = e.data.total; nav.mans = e.data.mans;
          done(); resolve();
        };
        const onerr = () => {                // ο worker απέτυχε → sync
          navWorker.removeEventListener("message", onmsg);
          navWorker.removeEventListener("error", onerr);
          navWorker = null;
          buildNavDataSync(route); done(); resolve();
        };
        navWorker.addEventListener("message", onmsg);
        navWorker.addEventListener("error", onerr);
        navWorker.postMessage({
          coords: route.geometry.coordinates,
          steps: (route.legs || []).flatMap(l => l.steps || []),
        });
      });
    }

    // Σημείο πάνω στη διαδρομή σε δεδομένη απόσταση κατά μήκος (μέτρα).
    function pointAtAlong(along) {
      if (along <= 0) return nav.pts[0];
      for (let i = 1; i < nav.cum.length; i++) {
        if (nav.cum[i] >= along) {
          const seg = nav.cum[i] - nav.cum[i - 1] || 1;
          const t = (along - nav.cum[i - 1]) / seg;
          const a = nav.pts[i - 1], b = nav.pts[i];
          return [a[0] + t * (b[0] - a[0]), a[1] + t * (b[1] - a[1])];
        }
      }
      return nav.pts[nav.pts.length - 1];
    }

    // Σβήνει το ήδη διανυθέν κομμάτι: αφήνει ορατό μόνο ό,τι είναι μπροστά.
    function trimRouteAhead(along) {
      let i = 0;
      while (i < nav.cum.length && nav.cum[i] < along) i++;
      const ahead = [pointAtAlong(along)];
      for (; i < nav.pts.length; i++) ahead.push(nav.pts[i]);
      routeLines[0].line.setLatLngs(ahead);
      drawAheadColored(along);           // + χρώματα κίνησης πάνω στο μπροστινό
    }

    // Χρωματίζει με την κίνηση ΜΟΝΟ το κομμάτι μπροστά μας (μαζί με το σβήσιμο).
    function drawAheadColored(along) {
      if (!nav.active || !nav.segColors) return;
      let i0 = 0;
      while (i0 < nav.cum.length && nav.cum[i0] < along) i0++;
      const pts = [pointAtAlong(along)];
      const cols = [];
      for (let i = Math.max(1, i0); i < nav.pts.length; i++) {
        pts.push(nav.pts[i]);
        cols.push(nav.segColors[i - 1]);
      }
      if (cols.length) paintSegments(pts, cols, trafficRouteLayer);
      else { trafficRouteLayer.clearLayers(); }
    }

    // (Επανα)υπολογισμός χρωμάτων κίνησης για την ενεργή διαδρομή πλοήγησης.
    // clear=true όταν ΑΛΛΑΞΕ η διαδρομή (έναρξη/επαναϋπολογισμός) — τότε τα
    // παλιά χρώματα δεν ταιριάζουν στα νέα σημεία και πρέπει να σβηστούν.
    // clear=false στην περιοδική ανανέωση (ίδια διαδρομή) — χωρίς τρεμόπαιγμα.
    async function refreshNavColors(clear) {
      nav.lastColorRefresh = Date.now();
      if (clear) { nav.segColors = null; trafficRouteLayer.clearLayers(); }
      const colors = await computeSegColors(nav.pts, nav.cum);
      if (!nav.active) return;
      nav.segColors = colors;            // τα επόμενα trims θα τα ζωγραφίσουν
      if (colors && nav.lastAlong != null) drawAheadColored(nav.lastAlong);
    }

    // Προβολή θέσης πάνω στη διαδρομή: απόσταση κατά μήκος + απόκλιση.
    // Βελτιστοποίηση: αντί να σαρώνουμε ΟΛΑ τα σημεία κάθε δευτερόλεπτο,
    // ψάχνουμε μόνο σε ένα παράθυρο γύρω από την τελευταία θέση (nav.snapIdx).
    // Πλήρης σάρωση μόνο στο πρώτο στίγμα ή αν χαθήκαμε — O(window) αντί O(N).
    function snapToRoute(p) {            // p=[lat,lon]
      const cosLat = Math.cos(toRad(p[0]));
      const mx = lon => lon * cosLat * 111320, my = lat => lat * 110540;
      const px = mx(p[1]), py = my(p[0]);
      const n = nav.pts.length;

      function scan(lo, hi) {
        let best = { off: Infinity, along: 0, idx: lo };
        for (let i = lo; i < hi; i++) {
          const ax = mx(nav.pts[i - 1][1]), ay = my(nav.pts[i - 1][0]);
          const bx = mx(nav.pts[i][1]), by = my(nav.pts[i][0]);
          const vx = bx - ax, vy = by - ay;
          const len2 = vx * vx + vy * vy;
          const t = len2 === 0 ? 0 : Math.max(0, Math.min(1, ((px - ax) * vx + (py - ay) * vy) / len2));
          const dx = px - (ax + t * vx), dy = py - (ay + t * vy);
          const off = Math.sqrt(dx * dx + dy * dy);
          if (off < best.off) {
            best = { off, along: nav.cum[i - 1] + t * (nav.cum[i] - nav.cum[i - 1]), idx: i };
          }
        }
        return best;
      }

      let best;
      if (nav.snapIdx > 0) {
        const lo = Math.max(1, nav.snapIdx - 3);
        const hi = Math.min(n, nav.snapIdx + 150);
        best = scan(lo, hi);
        // Μακριά ή στην άκρη του παραθύρου → πλήρης σάρωση (ασφάλεια/σωστότητα).
        if (best.off > 60 || best.idx >= hi - 1) best = scan(1, n);
      } else {
        best = scan(1, n);
      }
      nav.snapIdx = best.idx;
      return best;
    }

    function speak(text) {
      if (nav.muted) return;
      try {
        // 1η επιλογή: native Android TextToSpeech στα ελληνικά (μέσω γέφυρας).
        if (window.AndroidTTS && typeof AndroidTTS.speak === "function") {
          AndroidTTS.speak(text);
          return;
        }
        // 2η επιλογή (browser): SpeechSynthesis με ρητή ελληνική φωνή.
        if (!window.speechSynthesis) return;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "el-GR";
        const gv = (speechSynthesis.getVoices() || []).find(
          v => /el[-_]?gr/i.test(v.lang) || /greek|ελλ/i.test(v.name));
        if (gv) u.voice = gv;
        u.rate = 1.05;
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
      } catch (e) { /* χωρίς φωνή — μόνο οπτικά */ }
    }
    // Προθέρμανση λίστας φωνών του browser (φορτώνει ασύγχρονα).
    if (window.speechSynthesis) {
      speechSynthesis.getVoices();
      speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
    }
    function spokenDist(m) {
      if (m >= 950) return `${(Math.round(m / 100) / 10).toString().replace(".", " κόμμα ")} χιλιόμετρα`;
      return `${Math.round(m / 10) * 10} μέτρα`;
    }

    // ---- Εκκίνηση / τερματισμός -----------------------------------------
    $("startNav").addEventListener("click", startNavigation);
    $("navStop").addEventListener("click", stopNavigation);
    $("navMute").addEventListener("click", () => {
      nav.muted = !nav.muted;
      $("navMute").textContent = nav.muted ? "🔇" : "🔊";
      if (nav.muted && window.speechSynthesis) speechSynthesis.cancel();
    });

    async function startNavigation() {
      if (!routeLines.length) return;
      if (!navigator.geolocation) {
        resultEl.innerHTML = '<span class="error">Δεν υποστηρίζεται εντοπισμός θέσης.</span>';
        return;
      }
      await buildNavData(routeLines[activeIdx].route);
      // Κράτα μόνο την ενεργή διαδρομή στον χάρτη.
      routeLines.forEach((r, i) => { if (i !== activeIdx) r.line.remove(); });
      routeLines = [routeLines[activeIdx]];
      activeIdx = 0;

      nav.active = true;
      nav.lastPos = null;
      nav.lastAlong = 0;
      nav.firstFix = true;
      setFollow(true);
      // Στην πλοήγηση η μπλε γραμμή «σβήνει» πίσω μας ΚΑΙ το κομμάτι μπροστά
      // χρωματίζεται με την κίνηση (κίτρινο/κόκκινο) — μαζί, όχι το ένα ή το άλλο.
      trafficRouteLayer.clearLayers();
      refreshNavColors(true);            // async· τα trims ζωγραφίζουν όταν έρθει
      // Ενημέρωσε το Android ώστε να επιτρέψει το «μικρό παράθυρο» (PiP).
      if (window.AndroidApp && AndroidApp.setNavigating) AndroidApp.setNavigating(true);
      // Στην πλοήγηση οι ζωντανές αναφορές (Waze) ανάβουν αυτόματα.
      alertLayer.addTo(map);
      refreshAlerts();
      $("panel").style.display = "none";
      $("navBanner").style.display = "flex";
      $("navBottom").style.display = "flex";
      $("navText").textContent = "Εκκίνηση διαδρομής";
      $("navDist").textContent = "";
      $("navIco").textContent = "●";
      speak("Εκκίνηση διαδρομής.");
      // ΚΡΙΣΙΜΟ: το πάνελ κρύφτηκε, ο χάρτης μεγάλωσε — αλλιώς το Leaflet
      // κεντράρει με λάθος διαστάσεις και ο κέρσορας φεύγει εκτός οθόνης.
      setTimeout(() => {
        map.invalidateSize();
        if (nav.lastPos) recenterMap(nav.lastPos, 16);
      }, 60);
      // Δείξε ζωντανή κίνηση TomTom πάνω στη διαδρομή (αν υπάρχει κλειδί).
      if (trafficReady && !map.hasLayer(trafficLayer)) trafficLayer.addTo(map);

      nav.watchId = navigator.geolocation.watchPosition(onNavPosition, err => {
        $("navText").textContent = "Αποτυχία GPS: " + err.message;
      }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
    }

    function stopNavigation() {
      if (!nav.active) return;
      nav.active = false;
      nav.segColors = null;
      if (nav.watchId !== null) navigator.geolocation.clearWatch(nav.watchId);
      nav.watchId = null;
      if (window.speechSynthesis) speechSynthesis.cancel();
      if (window.AndroidApp && AndroidApp.setNavigating) AndroidApp.setNavigating(false);
      trafficRouteLayer.clearLayers(); map.removeLayer(trafficRouteLayer);
      setFollow(true);                   // κρύψε το κουμπί επανακέντρου
      $("panel").style.display = "flex";
      $("navBanner").style.display = "none";
      $("navBottom").style.display = "none";
      // Το πάνελ ξαναφάνηκε → ο χάρτης άλλαξε μέγεθος: ενημέρωσε το Leaflet.
      setTimeout(() => map.invalidateSize(), 50);
      if (routeLines.length) {
        suppressAutoUntil = Date.now() + 800;
        map.fitBounds(routeLines[0].line.getBounds(), { padding: [40, 40] });
      }
    }

    // ---- Κάθε νέο στίγμα GPS --------------------------------------------
    function onNavPosition(pos) {
      if (!nav.active) return;
      const p = [pos.coords.latitude, pos.coords.longitude];
      const spdKmh = (pos.coords.speed != null && !isNaN(pos.coords.speed) && pos.coords.speed >= 0)
        ? Math.round(pos.coords.speed * 3.6) : null;

      // Δείκτης θέσης με βέλος κατεύθυνσης.
      let heading = pos.coords.heading;
      if ((heading === null || isNaN(heading)) && nav.lastPos && havDist(nav.lastPos, p) > 3) {
        heading = bearing(nav.lastPos, p);
      }
      if (!myPosMarker) {
        myPosMarker = L.marker(p, {
          icon: L.divIcon({ className: "", html: '<div class="me-arrow"></div>', iconSize: [22, 26], iconAnchor: [11, 17] }),
          zIndexOffset: 2000,
        }).addTo(map);
      } else {
        myPosMarker.setLatLng(p);
      }
      if (heading !== null && !isNaN(heading)) {
        const el = myPosMarker.getElement();
        const arrow = el && el.querySelector(".me-arrow");
        if (arrow) arrow.style.transform = `rotate(${heading}deg)`;
      }
      // Κεντράρισμα ΜΟΝΟ όταν είμαστε σε follow mode — αλλιώς ο χρήστης
      // μπορεί ελεύθερα να κάνει zoom out / μετακίνηση και να δει την περιοχή.
      if (nav.firstFix) {
        nav.firstFix = false;
        recenterMap(p, 16);
      } else if (followMode) {
        recenterMap(p);                  // κρατά το τρέχον ζουμ του χρήστη
      }
      nav.lastPos = p;

      const snap = snapToRoute(p);

      // ---- Εκτός διαδρομής → επαναϋπολογισμός (σαν Google Maps) ----------
      // Σκάει ΑΜΕΣΩΣ αν είσαι >90 m μακριά (σαφώς άλλος δρόμος), αλλιώς
      // μετά από 2 συνεχόμενα στίγματα >40 m. Cooldown 6 δλ για να μην
      // μπει σε βρόχο αν το GPS χοροπηδάει.
      const nowMs = Date.now();
      if (snap.off > 40) nav.offCount++; else nav.offCount = 0;
      const canReroute = !nav.recalcing && (nowMs - (nav.lastReroute || 0) > 6000);
      if (canReroute && (snap.off > 90 || nav.offCount >= 2)) {
        nav.recalcing = true;
        nav.lastReroute = nowMs;
        nav.offCount = 0;
        $("navIco").textContent = "↻";
        $("navDist").textContent = "";
        $("navText").textContent = "Εκτός διαδρομής — επαναϋπολογισμός…";
        speak("Επαναϋπολογισμός διαδρομής.");
        origin = { lat: p[0], lon: p[1] };
        placeMarker("A", origin);
        calculateRoute()
          .catch(() => {})
          .finally(() => { nav.recalcing = false; nav.offCount = 0; });
        return;
      }
      if (nav.recalcing) return;         // περίμενε να έρθει η νέα διαδρομή

      // Σβήσε το κομμάτι που ήδη διανύθηκε — κράτα ορατό μόνο το μπροστά.
      nav.lastAlong = snap.along;
      if (!nav.recalcing && routeLines.length) trimRouteAhead(snap.along);

      // Κράτα φρέσκα τα χρώματα κίνησης (ίδια διαδρομή) ανά ~2,5 λεπτά.
      if (trafficReady && !nav.recalcing && Date.now() - (nav.lastColorRefresh || 0) > 150000)
        refreshNavColors(false);

      // Φωνητική προειδοποίηση για περιστατικά κίνησης / τροχαία κοντά σου.
      warnNearbyTomTom(p);
      warnNearbyWaze(p);

      // Άφιξη;
      const remaining = Math.max(0, nav.total - snap.along);
      if (remaining < 25) {
        $("navIco").textContent = "🏁";
        $("navDist").textContent = "";
        $("navText").textContent = "Έφτασες στον προορισμό!";
        speak("Έφτασες στον προορισμό.");
        setTimeout(stopNavigation, 4000);
        return;
      }

      // Επόμενος ελιγμός.
      let next = null, nextIdx = -1;
      for (let i = 0; i < nav.mans.length; i++) {
        if (nav.mans[i].at > snap.along + 8) { next = nav.mans[i]; nextIdx = i; break; }
      }
      if (next) {
        const dTo = next.at - snap.along;
        const [ico, text] = stepInfo(next.step);
        $("navIco").textContent = ico;
        $("navDist").textContent = fmtDist(dTo);
        $("navText").textContent = text;

        // Φωνητικές αναγγελίες: μία προειδοποίηση, μία τελική.
        const key = nextIdx;
        const warnAt = mode === "car" ? 350 : 120;
        const nowAt = mode === "car" ? 60 : 25;
        const plain = text.replace(/[«»]/g, "");
        if (dTo < nowAt && nav.announced[key] !== 2) {
          nav.announced[key] = 2;
          speak(plain);
        } else if (dTo < warnAt && !nav.announced[key]) {
          nav.announced[key] = 1;
          speak(`Σε ${spokenDist(dTo)}, ${plain.toLowerCase()}`);
        }
      }

      // Κάτω μπάρα: υπόλοιπο + εκτίμηση άφιξης.
      const remainSec = nav.duration * (remaining / nav.total);
      const eta = new Date(Date.now() + remainSec * 1000);
      const etaStr = eta.toLocaleTimeString("el-GR", { hour: "2-digit", minute: "2-digit" });
      $("navStats").innerHTML =
        `<strong>${fmtDist(remaining)}</strong> · ${fmtDur(remainSec)} · άφιξη ${etaStr}` +
        (spdKmh != null ? ` · ${spdKmh} km/h` : "");
    }

    // ====================================================================
    // ΕΙΔΟΠΟΙΗΣΕΙΣ ΟΜΑΔΩΝ (Viber) — τροχαία / ατύχημα / αλκοτέστ.
    // Διαβάζει τις ειδοποιήσεις που ήδη λαμβάνει το κινητό (native bridge
    // window.AndroidAlerts), αναγνωρίζει τύπο + τοποθεσία, και βάζει σημάδι
    // στον χάρτη. Χωρίς server — όλα τοπικά.
    // ====================================================================
    // Ομάδες που παρακολουθούμε — αρκεί κομμάτι του ονόματος,
    // χωρίς τόνους/κεφαλαία (το native κάνει accent-insensitive match).
    const WATCH_GROUPS = ["αλερτ", "δρακουμ"];
    const ALERT_MAX_AGE = 6 * 3600 * 1000;   // 6 ώρες

    const alertMarkers = {};                 // id → {marker, data}
    let alertsVisible = false;
    let alertLayer = L.layerGroup();

    // Πεζά + χωρίς τόνους, για ανθεκτικό ταίριασμα λέξεων-κλειδιών.
    function normTxt(s) {
      return (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    }

    // Όλα τα μηνύματα των ομάδων εμφανίζονται — η κατηγορία καθορίζει
    // μόνο το εικονίδιο. Καλύπτει και την αργκό των ομάδων:
    // «πιστόλι» = ραντάρ, «χωμένοι» = κρυμμένη τροχαία,
    // «ασφαλιστικό/με φάρους» = συμβατικό όχημα, «κάνουν βόλτες» = περιπολία.
    function alertType(text) {
      const t = normTxt(text);
      if (/αλκοτ|αλκοολ|μεθυσ/.test(t))
        return { type: "alcotest", ico: "🍺", label: "Αλκοτέστ" };
      if (/πιστολ|ρανταρ|καμερ/.test(t))
        return { type: "radar", ico: "📸", label: "Ραντάρ" };
      if (/ατυχημ|τρακαρ|καραμπολ|συγκρου|χτυπησ|αναποδογυρ/.test(t))
        return { type: "accident", ico: "💥", label: "Ατύχημα" };
      if (/φωτια|καπν|ντουμανι/.test(t))
        return { type: "fire", ico: "🔥", label: "Φωτιά / Καπνός" };
      if (/μπλοκ|τροχαι|ελεγχ|περιπολ|αστυνομ|χωμεν|ασφαλιστικ|φαρους|σταματ|βολτες|διπλωμ/.test(t))
        return { type: "police", ico: "🚓", label: "Τροχαία / Έλεγχος" };
      return { type: "other", ico: "⚠️", label: "Αναφορά" };
    }

    function guessPlace(text) {
      // Τοποθεσία μετά από πρόθεση ή λέξη-σημείο. Δουλεύει και με πεζά
      // («μπλόκο στη λαμπρακη»). Χωρίς τόνους για το geocoding (ΟΚ για Nominatim).
      const t = normTxt(text).replace(/^[^:]{2,25}:\s*/, ""); // κόψε "Όνομα: "
      // (?:^|[\s,.!;]) = η πρόθεση πρέπει να είναι ολόκληρη λέξη,
      // αλλιώς το «χρή-στη» πιάνεται λάθος ως «στη».
      const m = t.match(
        /(?:^|[\s,.!;(])(?:στην|στη|στο|στον|στα|στις|στους|διασταυρωση|κυκλακι|κομβο|υψος|εξω απο το|εξω απο|πριν τον|πριν την|πριν το|προς)\s+([a-zα-ω][\wͰ-Ͽ.\-]{2,}(?:\s+[a-zα-ω][\wͰ-Ͽ.\-]{2,})?)/);
      if (!m) return null;
      // Πέτα σκέτα άρθρα/συνδέσμους που τυχόν πιάστηκαν.
      const place = m[1].replace(/\b(και|για|απο|του|της|των|ειναι|οτι)\b.*$/, "").trim();
      return place.length >= 3 ? place : null;
    }

    function alertId(a) {
      // Σταθερό id ανά μήνυμα (ομάδα + κείμενο) — όχι χρόνο, ώστε οι
      // επαναδημοσιεύσεις του Viber να μη βγαίνουν διπλές.
      return normTxt(a.g).slice(0, 15) + "|" + normTxt(a.m).slice(0, 60);
    }

    // Teasers του Viber («Δείτε σημερινό μήνυμα χρήστη…») — όχι μηνύματα.
    function isNoise(text) {
      return /δειτε .{0,20}μηνυμα|ισως χασατε|νεα μηνυματα|αναπαντητη|missed call|new message|σας καλει|calling|εγινε μελος|joined|reacted|αντεδρασε/.test(normTxt(text));
    }

    async function resolveAlert(a) {
      if (isNoise(a.m)) return null;     // φιλτράρει και ήδη αποθηκευμένα
      const cls = alertType(a.m);
      if (!cls) return null;
      // Πολύ σύντομο κείμενο χωρίς καμία λέξη-κλειδί (π.χ. σκέτο όνομα
      // αποστολέα από teaser) → δεν είναι χρήσιμη αναφορά.
      if (cls.type === "other" &&
          a.m.replace(/^[^:]{2,25}:\s*/, "").trim().split(/\s+/).length <= 2)
        return null;
      const place = guessPlace(a.m);
      let coords = null;
      if (place) {
        // Γεωκωδικοποίηση με προτίμηση στην περιοχή της ομάδας.
        const region = /χαλκιδικ|δρακουμ/i.test(a.g) ? "Χαλκιδική"
          : /θεσσαλον/i.test(a.g) ? "Θεσσαλονίκη" : "";
        try {
          coords = await geocode(place + (region ? ", " + region : "") + ", Ελλάδα");
        } catch (e) { coords = null; }
      }
      return { id: alertId(a), cls, place, coords, t: a.t, g: a.g, m: a.m };
    }

    function renderAlertMarker(r) {
      if (!r.coords || alertMarkers[r.id]) return;
      const marker = L.marker([r.coords.lat, r.coords.lon], {
        icon: L.divIcon({ className: "", html: `<div class="alert-pin">${r.cls.ico}</div>`,
          iconSize: [26, 26], iconAnchor: [13, 13] }),
        zIndexOffset: 1500,
      });
      const when = new Date(r.t).toLocaleTimeString("el-GR", { hour: "2-digit", minute: "2-digit" });
      marker.bindPopup(`<b>${r.cls.ico} ${r.cls.label}</b><br>${r.m}<br><small>${r.g} · ${when}</small>`);
      marker.addTo(alertLayer);
      alertMarkers[r.id] = { marker, data: r };
    }

    // ------------------------------------------------------------------
    // WAZE LIVE ALERTS — η κύρια πηγή: ζωντανές αναφορές οδηγών (τροχαία,
    // ατυχήματα, κίνδυνοι) με ακριβείς συντεταγμένες. Χωρίς κλειδί.
    // ------------------------------------------------------------------
    const WAZE_TYPES = {
      POLICE:      { ico: "🚓", label: "Τροχαία" },
      ACCIDENT:    { ico: "💥", label: "Ατύχημα" },
      HAZARD:      { ico: "⚠️", label: "Κίνδυνος στον δρόμο" },
      ROAD_CLOSED: { ico: "🚧", label: "Κλειστός δρόμος" },
    };
    let wazeItems = [];                    // τελευταία απάντηση (για τη λίστα)
    const wazeMarkers = {};                // uuid → marker
    const wazeAnnounced = {};              // uuid → ειπώθηκε φωνητικά
    let wazeError = "";

    function wazeAge(t) {
      const min = Math.max(0, Math.round((Date.now() - t) / 60000));
      if (min < 1) return "τώρα";
      if (min < 60) return `πριν ${min} λεπ`;
      return `πριν ${Math.floor(min / 60)} ώρ ${min % 60} λεπ`;
    }

    async function refreshWaze() {
      const b = map.getBounds();
      // Το Waze θέλει λογικό παράθυρο — σε πολύ μακρινό ζουμ δεν απαντά.
      if (b.getNorth() - b.getSouth() > 2.5 || b.getEast() - b.getWest() > 3) {
        wazeError = "Κάνε ζουμ πιο κοντά για να φανούν οι αναφορές Waze.";
        return;
      }
      const box = `top=${b.getNorth()}&bottom=${b.getSouth()}` +
        `&left=${b.getWest()}&right=${b.getEast()}`;
      const urls = [
        `https://www.waze.com/live-map/api/georss?${box}&env=row&types=alerts`,
        `https://www.waze.com/rtserver/web/TGeoRSS?tk=community&format=JSON&${box}`,
      ];
      for (const url of urls) {
        try {
          const resp = await fetch(url);
          if (!resp.ok) throw new Error("HTTP " + resp.status);
          const data = await resp.json();
          wazeError = "";
          renderWaze((data.alerts || []).filter(a => WAZE_TYPES[a.type]));
          return;
        } catch (e) {
          wazeError = "Waze: αποτυχία λήψης (" + e.message + ")";
        }
      }
    }

    function renderWaze(alerts) {
      wazeItems = alerts;
      const live = {};
      alerts.forEach(a => {
        live[a.uuid] = true;
        if (wazeMarkers[a.uuid]) return;   // υπάρχει ήδη
        const wt = WAZE_TYPES[a.type];
        const label = a.subType === "POLICE_HIDING" ? "Κρυμμένη τροχαία" : wt.label;
        const m = L.marker([a.location.y, a.location.x], {
          icon: L.divIcon({ className: "", html: `<div class="alert-pin">${wt.ico}</div>`,
            iconSize: [26, 26], iconAnchor: [13, 13] }),
          zIndexOffset: 1400,
        });
        m.bindPopup(`<b>${wt.ico} ${label}</b><br>` +
          `${[a.street, a.city].filter(Boolean).join(", ") || "—"}<br>` +
          `<small>Waze · ${wazeAge(a.pubMillis)} · 👍 ${a.nThumbsUp || 0}</small>`);
        m.addTo(alertLayer);
        wazeMarkers[a.uuid] = m;
      });
      // Καθάρισε αναφορές που έληξαν.
      for (const id in wazeMarkers) {
        if (!live[id]) { wazeMarkers[id].remove(); delete wazeMarkers[id]; }
      }
    }

    // Φωνητική προειδοποίηση όσο οδηγείς: τροχαία/ατύχημα σε <600 m.
    function warnNearbyWaze(p) {
      for (const a of wazeItems) {
        if (a.type !== "POLICE" && a.type !== "ACCIDENT") continue;
        if (wazeAnnounced[a.uuid]) continue;
        const d = havDist(p, [a.location.y, a.location.x]);
        if (d < 600) {
          wazeAnnounced[a.uuid] = true;
          const label = a.type === "POLICE"
            ? (a.subType === "POLICE_HIDING" ? "κρυμμένη τροχαία" : "τροχαία")
            : "ατύχημα";
          speak(`Προσοχή, ${label} σε ${spokenDist(d)}.`);
        }
      }
    }

    // ------------------------------------------------------------------
    // TOMTOM TRAFFIC INCIDENTS — δομημένα περιστατικά κίνησης (ατυχήματα,
    // κλειστοί δρόμοι, έργα, μποτιλιαρίσματα) με ακριβείς συντεταγμένες.
    // Χρησιμοποιεί το ΙΔΙΟ κλειδί TomTom με το overlay κίνησης.
    // ------------------------------------------------------------------
    // iconCategory → εικονίδιο + ελληνική ετικέτα.
    const TT_CAT = {
      0: { ico: "⚠️", label: "Συμβάν" },
      1: { ico: "💥", label: "Ατύχημα" },
      2: { ico: "🌫️", label: "Ομίχλη" },
      3: { ico: "⚠️", label: "Επικίνδυνες συνθήκες" },
      4: { ico: "🌧️", label: "Βροχή" },
      5: { ico: "🧊", label: "Πάγος" },
      6: { ico: "🚗", label: "Μποτιλιάρισμα" },
      7: { ico: "🚧", label: "Κλειστή λωρίδα" },
      8: { ico: "⛔", label: "Κλειστός δρόμος" },
      9: { ico: "🚧", label: "Έργα στον δρόμο" },
      10: { ico: "💨", label: "Άνεμος" },
      11: { ico: "🌊", label: "Πλημμύρα" },
      14: { ico: "🚗", label: "Ακινητοποιημένο όχημα" },
    };
    let tomtomItems = [];
    const tomtomMarkers = {};
    const tomtomAnnounced = {};
    let tomtomError = "";

    function ttFirstCoord(geom) {
      if (!geom || !geom.coordinates) return null;
      let c = geom.coordinates;
      while (Array.isArray(c[0])) c = c[0];   // Point → [lon,lat], Line → [[..]]
      return { lat: c[1], lon: c[0] };
    }

    async function refreshTomTom() {
      if (!trafficReady) { tomtomError = ""; tomtomItems = []; return; }
      const b = map.getBounds();
      if (b.getNorth() - b.getSouth() > 2 || b.getEast() - b.getWest() > 2.5) {
        tomtomError = "Κάνε ζουμ πιο κοντά για τα περιστατικά κίνησης.";
        return;
      }
      const bbox = `${b.getWest()},${b.getSouth()},${b.getEast()},${b.getNorth()}`;
      const fields = encodeURIComponent(
        "{incidents{type,geometry{type,coordinates},properties{iconCategory," +
        "magnitudeOfDelay,events{description,iconCategory},startTime,from,to,delay,roadNumbers}}}");
      const url = "https://api.tomtom.com/traffic/services/5/incidentDetails" +
        `?key=${TRAFFIC_KEY}&bbox=${bbox}&fields=${fields}` +
        "&language=el-GR&timeValidityFilter=present";
      try {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        const data = await resp.json();
        tomtomError = "";
        renderTomTom(data.incidents || []);
      } catch (e) {
        tomtomError = "TomTom: αποτυχία λήψης (" + e.message + ")";
      }
    }

    function ttIncident(inc) {
      const pr = inc.properties || {};
      const cat = TT_CAT[pr.iconCategory] || TT_CAT[0];
      const ev = (pr.events && pr.events[0] && pr.events[0].description) || cat.label;
      const road = (pr.roadNumbers && pr.roadNumbers[0]) ? pr.roadNumbers[0] + " · " : "";
      const where = [pr.from, pr.to].filter(Boolean).join(" → ");
      const coord = ttFirstCoord(inc.geometry);
      const id = pr.iconCategory + "|" + (coord ? coord.lat.toFixed(4) + "," + coord.lon.toFixed(4) : ev);
      const t = pr.startTime ? Date.parse(pr.startTime) : Date.now();
      return { id, cat, ev, road, where, coord, t, delay: pr.delay || 0 };
    }

    function renderTomTom(incidents) {
      const parsed = incidents.map(ttIncident).filter(i => i.coord);
      tomtomItems = parsed;
      const live = {};
      parsed.forEach(i => {
        live[i.id] = true;
        if (tomtomMarkers[i.id]) return;
        const m = L.marker([i.coord.lat, i.coord.lon], {
          icon: L.divIcon({ className: "", html: `<div class="alert-pin">${i.cat.ico}</div>`,
            iconSize: [26, 26], iconAnchor: [13, 13] }),
          zIndexOffset: 1300,
        });
        const delayTxt = i.delay ? ` · καθυστ. ${Math.round(i.delay / 60)} λεπ` : "";
        m.bindPopup(`<b>${i.cat.ico} ${i.cat.label}</b><br>${i.road}${i.ev}<br>` +
          `<small>${i.where || "—"} · TomTom${delayTxt}</small>`);
        m.addTo(alertLayer);
        tomtomMarkers[i.id] = m;
      });
      for (const id in tomtomMarkers) {
        if (!live[id]) { tomtomMarkers[id].remove(); delete tomtomMarkers[id]; }
      }
    }

    // Φωνητική προειδοποίηση για ατύχημα/κλειστό δρόμο/μποτιλιάρισμα κοντά.
    const TT_WARN = [TT_CAT[1], TT_CAT[8], TT_CAT[6]];
    function warnNearbyTomTom(p) {
      for (const i of tomtomItems) {
        if (!TT_WARN.includes(i.cat) || tomtomAnnounced[i.id]) continue;
        const d = havDist(p, [i.coord.lat, i.coord.lon]);
        if (d < 700) {
          tomtomAnnounced[i.id] = true;
          speak(`Προσοχή, ${i.cat.label.toLowerCase()} σε ${spokenDist(d)}.`);
        }
      }
    }

    // ------------------------------------------------------------------
    // Δύο καρτέλες — Κίνηση (TomTom + Waze) / Ομάδες (Viber). Τηλεγραφικά.
    // ------------------------------------------------------------------
    const hhmm = t => new Date(t).toLocaleTimeString("el-GR", { hour: "2-digit", minute: "2-digit" });

    function paintList(el, entries, emptyMsg) {
      entries.sort((a, b) => b.t - a.t);
      if (!entries.length) { el.innerHTML = '<div class="empty">' + emptyMsg + "</div>"; return; }
      el.innerHTML = "";
      entries.forEach(e => {
        const div = document.createElement("div");
        div.className = "a";
        div.innerHTML = `<span class="ai">${e.ico}</span>` +
          `<span class="am"><b>${e.main}</b><span class="sub">${e.sub}</span></span>` +
          `<span class="at">${hhmm(e.t)}</span>`;
        div.onclick = e.go;
        el.appendChild(div);
      });
    }

    // Καρτέλα «Κίνηση»: περιστατικά TomTom + αναφορές Waze.
    function renderTrafficTab() {
      const entries = [];
      tomtomItems.forEach(i => entries.push({
        ico: i.cat.ico,
        main: (i.road || "") + i.ev,
        sub: (i.where || i.cat.label) + (i.delay ? " · +" + Math.round(i.delay / 60) + "′" : ""),
        t: i.t,
        go: () => { map.setView([i.coord.lat, i.coord.lon], 15);
                    if (tomtomMarkers[i.id]) tomtomMarkers[i.id].openPopup(); },
      }));
      wazeItems.forEach(a => {
        const wt = WAZE_TYPES[a.type];
        entries.push({
          ico: wt.ico,
          main: a.subType === "POLICE_HIDING" ? "Κρυμμένη τροχαία" : wt.label,
          sub: ([a.street, a.city].filter(Boolean).join(", ") || "") + " · " + wazeAge(a.pubMillis),
          t: a.pubMillis,
          go: () => { map.setView([a.location.y, a.location.x], 15);
                      if (wazeMarkers[a.uuid]) wazeMarkers[a.uuid].openPopup(); },
        });
      });
      const empty = !trafficReady
        ? "Χρειάζεται κλειδί TomTom για περιστατικά κίνησης."
        : (tomtomError || wazeError || "Καμία αναφορά εδώ τώρα — ζουμ σε πόλη/αυτοκινητόδρομο.");
      paintList($("trafficList"), entries, empty);
    }

    // Καρτέλα «Ομάδες»: μηνύματα Viber.
    function renderGroupsTab(groupItems, rawCount) {
      const entries = groupItems.map(r => ({
        ico: r.cls.ico, main: r.m, sub: r.g + (r.place ? " · " + r.place : ""), t: r.t,
        go: () => { if (r.coords) { map.setView([r.coords.lat, r.coords.lon], 15);
                    if (alertMarkers[r.id]) alertMarkers[r.id].marker.openPopup(); } },
      }));
      const empty = window.AndroidAlerts
        ? `Ελήφθησαν ${rawCount || 0}. Ενεργοποίησε «Διάβασμα ομάδων» και άνοιξε την ομάδα.`
        : "Διαθέσιμο μόνο στο APK (ανάγνωση ομάδων).";
      paintList($("groupsList"), entries, empty);
    }

    async function collectGroupAlerts() {
      if (!window.AndroidAlerts) return { items: [], raw: 0 };
      try { AndroidAlerts.setGroups(WATCH_GROUPS.join("|")); } catch (e) {}
      let raw = [];
      try { raw = JSON.parse(AndroidAlerts.list() || "[]"); } catch (e) { raw = []; }
      const resolved = [], seen = {};
      for (const a of raw) {
        if (Date.now() - a.t > ALERT_MAX_AGE) continue;
        const r = await resolveAlert(a);
        if (r && !seen[r.id]) { seen[r.id] = true; resolved.push(r); renderAlertMarker(r); }
      }
      return { items: resolved, raw: raw.length };
    }

    async function refreshAlerts() {
      updateAlertsEnable();
      // Παράλληλα: TomTom + Waze + ομάδες μαζί (δεν περιμένει το ένα το άλλο).
      const [, , g] = await Promise.all([refreshTomTom(), refreshWaze(), collectGroupAlerts()]);
      renderTrafficTab();
      renderGroupsTab(g.items, g.raw);
    }

    function updateAlertsEnable() {
      const box = $("alertsEnable");
      if (!window.AndroidAlerts) { box.innerHTML = ""; return; }
      const reader = AndroidAlerts.hasReader && AndroidAlerts.hasReader();
      if (reader) { box.innerHTML = ""; return; }
      box.innerHTML = '<button id="readerGrant">📖 Ενεργοποίηση διαβάσματος ομάδων</button>';
      $("readerGrant").onclick = () => AndroidAlerts.openReaderSettings();
    }

    // ---- Εναλλαγή καρτελών ----
    document.querySelectorAll("#alertsTabs .tab").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#alertsTabs .tab").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const t = btn.dataset.tab;
        $("tabTraffic").hidden = t !== "traffic";
        $("tabGroups").hidden = t !== "groups";
      });
    });

    $("alertsBtn").addEventListener("click", () => {
      alertsVisible = !alertsVisible;
      $("alertsBtn").classList.toggle("on", alertsVisible);
      $("alertsPanel").style.display = alertsVisible ? "block" : "none";
      if (alertsVisible) {
        alertLayer.addTo(map);
        refreshAlerts();
      }
    });
    $("alertsClear").addEventListener("click", () => {
      try { AndroidAlerts && AndroidAlerts.clear(); } catch (e) {}
      Object.values(alertMarkers).forEach(o => o.marker.remove());
      for (const k in alertMarkers) delete alertMarkers[k];
      refreshAlerts();
    });

    // Περιοδική ανανέωση: στο panel ή κατά την πλοήγηση.
    setInterval(() => { if (alertsVisible || nav.active) refreshAlerts(); }, 60000);
    // Νέα περιοχή στον χάρτη → φρέσκες αναφορές Waze (με μικρή καθυστέρηση).
    let wazeMoveTimer = null;
    map.on("moveend", () => {
      if (!alertsVisible && !nav.active) return;
      clearTimeout(wazeMoveTimer);
      wazeMoveTimer = setTimeout(refreshAlerts, 1200);
    });
  </script>
</body>
</html>
