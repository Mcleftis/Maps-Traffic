AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

# =====================================================================
# Maps-Traffic — Φάση 0+1: ingest, routing, live store, archive
#
# ΕΚΠΑΙΔΕΥΤΙΚΟ. Δεν έχει γίνει deploy. Πριν από κάθε deploy:
#   1. Στήσε budget alarm  (docs/aws/lab/00-account-setup.md)
#   2. Διάβασε το docs/aws/07-cost.md
#
#   sam deploy --guided --stack-name maps-traffic-ingest \
#              --capabilities CAPABILITY_IAM --region eu-central-1
#
# Teardown:  sam delete --stack-name maps-traffic-ingest
# =====================================================================

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  RetentionDays:
    Type: Number
    Default: 30
    Description: Ημέρες πριν τα raw δεδομένα πάνε σε φθηνότερη κλάση
  # Χωρίς Default επίτηδες: ένα λάθος issuer/audience δεν αποτυγχάνει στο
  # deploy, απαντά 401 σε κάθε αίτημα για πάντα. Καλύτερα να σταματήσει το
  # CloudFormation παρά να ανέβει ένα API που δεν δέχεται κανέναν.
  OidcIssuer:
    Type: String
    AllowedPattern: '^https://.+'
    Description: >-
      Ο third-party OIDC provider που εκδίδει τα JWT του Android app.
      Πρέπει να σερβίρει /.well-known/openid-configuration — από εκεί το
      API Gateway κατεβάζει μόνο του το JWKS για την επαλήθευση υπογραφής.
  OidcAudience:
    Type: String
    MinLength: 1
    Description: To aud claim· συνήθως το client id του Android app.

  EnableMediaPath:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Ενεργοποιεί το media path (φωνητικό/φωτογραφικό alert). Κλειστό όσο
      δεν υπάρχει client που ανεβάζει αρχεία: αλλιώς στήνονται πόροι που
      δεν χρησιμοποιεί κανείς.

  EnableArchivePath:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Ενεργοποιεί το archive path (EventBridge -> Firehose -> S3).
      Απαιτεί ενεργοποιημένο Kinesis Data Firehose στον λογαριασμό·
      αλλιώς το deploy αποτυγχάνει με SubscriptionRequiredException.

Conditions:
  MediaPathEnabled: !Equals [!Ref EnableMediaPath, 'true']
  ArchivePathEnabled: !Equals [!Ref EnableArchivePath, 'true']

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]        # Graviton: ~20% φθηνότερα από x86
    Timeout: 10
    MemorySize: 512
    Tracing: Active               # X-Ray
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: maps-traffic
        LOG_LEVEL: INFO

Resources:

  # -------------------------------------------------------------------
  # STORAGE
  # -------------------------------------------------------------------
  RawBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain        # τα raw δεδομένα δεν σβήνονται με το stack
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'maps-traffic-raw-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: TierOldData
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: !Ref RetentionDays
          - Id: CleanIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  CuratedBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'maps-traffic-curated-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms

  # -------------------------------------------------------------------
  # LIVE STORE
  # PK = geohash5 (κελί ~5km), SK = occurredAt#eventId
  # Το TTL σβήνει μόνο του μετά τις 6 ώρες — αντικαθιστά το MAX_AGE_MS
  # του σημερινού relay/worker.js, χωρίς κόστος.
  # -------------------------------------------------------------------
  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'maps-traffic-alerts-${Environment}'
      BillingMode: PAY_PER_REQUEST      # χωρίς capacity planning
      AttributeDefinitions:
        - {AttributeName: geohash5,  AttributeType: S}
        - {AttributeName: sortKey,   AttributeType: S}
      KeySchema:
        - {AttributeName: geohash5,  KeyType: HASH}
        - {AttributeName: sortKey,   KeyType: RANGE}
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # -------------------------------------------------------------------
  # EVENT BUS
  # -------------------------------------------------------------------
  TrafficBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub 'maps-traffic-${Environment}'

  # Archive: επιτρέπει replay events μιας ημερομηνίας σε νέο consumer.
  # Από τα πιο υποτιμημένα χαρακτηριστικά του EventBridge.
  BusArchive:
    Type: AWS::Events::Archive
    Properties:
      ArchiveName: !Sub 'maps-traffic-archive-${Environment}'
      SourceArn: !GetAtt TrafficBus.Arn
      RetentionDays: 90

  # -------------------------------------------------------------------
  # INGEST — το συγχρονο όριο. Επικυρώνει, κανονικοποιεί, δημοσιεύει.
  # Ό,τι είναι αργό γίνεται async μετά το EventBridge.
  # -------------------------------------------------------------------
  # Κοινός κώδικας (geohash) — ένα αντίγραφο, δύο functions.
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub 'maps-traffic-common-${Environment}'
      ContentUri: ../src/common/
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [arm64]
      RetentionPolicy: Delete

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'maps-traffic-ingest-${Environment}'
      Handler: ingest.handler
      CodeUri: ../src/ingest/
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          EVENT_BUS_NAME: !Ref TrafficBus
      Policies:
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref TrafficBus
      Events:
        PostAlert:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /alerts
            Method: POST
            # Request validation: κακοσχηματισμένο σώμα κόβεται με 400 στο
            # API Gateway, χωρίς να ξυπνήσει Lambda.
            RequestModel:
              Model: Alert
              Required: true
              ValidateBody: true

  QueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'maps-traffic-query-${Environment}'
      Handler: query.handler
      CodeUri: ../src/query/
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          TABLE_NAME: !Ref AlertsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AlertsTable
      Events:
        GetAlerts:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /alerts
            Method: GET
            RequestParameters:
              - method.request.querystring.lat:
                  Required: true
              - method.request.querystring.lon:
                  Required: true
            # Χωρίς αυτό το RequestModel το `Required: true` παραπάνω είναι
            # διακοσμητικό: το API Gateway επιβάλλει παραμέτρους μόνο όταν
            # υπάρχει request validator δεμένος στο method. Το σώμα δεν
            # ελέγχεται (GET δεν έχει), μόνο οι παράμετροι.
            RequestModel:
              Model: Query
              Required: false
              ValidateBody: false
              ValidateParameters: true

  # -------------------------------------------------------------------
  # LIVE STORE WRITER — EventBridge -> DynamoDB
  # Ο κρίκος ανάμεσα στο ingest και στο query: χωρίς αυτόν το GET /alerts
  # απαντά πάντα άδειο.
  # -------------------------------------------------------------------
  StoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'maps-traffic-store-${Environment}'
      Handler: store.handler
      CodeUri: ../src/store/
      Environment:
        Variables:
          TABLE_NAME: !Ref AlertsTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref AlertsTable
      Events:
        AlertCreated:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref TrafficBus
            Pattern:
              source: [maps-traffic.ingest]
              detail-type: [traffic.alert.created]
            DeadLetterConfig:
              Type: SQS
              Destination: !GetAtt StoreDlq.Arn

  # Ποτέ async target χωρίς DLQ: αλλιώς ένα event που αποτυγχάνει σταθερά
  # εξαφανίζεται μετά τις retries και δεν το μαθαίνει κανείς.
  StoreDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'maps-traffic-store-dlq-${Environment}'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  # -------------------------------------------------------------------
  # REST API — τρία πράγματα που το HTTP API δεν έχει καθόλου:
  # API keys, usage plans (quota) και request validation.
  # Το αντίτιμο: το JWT δεν επαληθεύεται από την υπηρεσία αλλά από τον
  # AuthorizerFunction, δηλαδή ένα invocation παραπάνω ανά αίτημα.
  # -------------------------------------------------------------------
  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Auth:
        # Δύο ανεξάρτητες πύλες: το JWT λέει ΠΟΙΟΣ είσαι, το API key σε ποιο
        # usage plan ανήκεις. Και τα δύο πρέπει να περάσουν.
        ApiKeyRequired: true
        DefaultAuthorizer: OidcAuthorizer
        # Το preflight OPTIONS το στέλνει ο browser ΠΡΙΝ ξέρει ότι χρειάζεται
        # credentials: φεύγει χωρίς Authorization και χωρίς x-api-key. Αν του
        # ζητήσεις είτε το ένα είτε το άλλο, απαντά 401 και ο client δεν
        # φτάνει ποτέ στο πραγματικό αίτημα. Το SAM τα βάζει και τα δύο by
        # default — εδώ αφαιρούνται ρητά.
        AddDefaultAuthorizerToCorsPreflight: false
        AddApiKeyRequiredToCorsPreflight: false
        Authorizers:
          OidcAuthorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            FunctionPayloadType: REQUEST
            Identity:
              Headers: [Authorization]
              # Cache ανά token: χωρίς αυτό πληρώνεις authorizer invocation
              # σε κάθε κλήση.
              ReauthorizeEvery: 300
        UsagePlan:
          CreateUsagePlan: PER_API
          Description: Όριο ανά κλειδί για το Android app
          Quota:
            Limit: 10000
            Period: MONTH
          Throttle:
            BurstLimit: 100
            RateLimit: 50
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization,x-api-key'"
        AllowMethods: "'GET,POST,OPTIONS'"
      Models:
        # Το API Gateway δέχεται μόνο string στο `type` — union types
        # (`[object, array]`) απορρίπτονται από τον Swagger parser του.
        # Δεν πειράζει: το συμβόλαιο του client είναι ήδη πίνακας
        # (relay/worker.js: `body: [{id,t,g,m,lat,lon,...}]`) και το
        # ingest.py τον δέχεται αυτούσιο.
        # Κέλυφος: υπάρχει μόνο για να μπορεί το GET να δείξει σε validator
        # παραμέτρων — το σώμα του GET δεν ελέγχεται ποτέ.
        Query:
          $schema: 'http://json-schema.org/draft-04/schema#'
          title: Query
          type: object

        Alert:
          $schema: 'http://json-schema.org/draft-04/schema#'
          title: Alert
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [lat, lon]
            properties:
              lat: {type: number, minimum: 34, maximum: 42}
              lon: {type: number, minimum: 19, maximum: 30}
              m: {type: string, maxLength: 500}
              t: {type: number}
              g: {type: string, maxLength: 120}
              id: {type: string, maxLength: 120}
              label: {type: string, maxLength: 120}
              device: {type: string, maxLength: 200}
              producer: {type: string, maxLength: 120}

  # Επαληθεύει το JWT του OIDC provider. Δες src/authorizer/authorizer.py.
  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub 'maps-traffic-authorizer-${Environment}'
      Handler: authorizer.handler
      CodeUri: ../src/authorizer/
      Environment:
        Variables:
          OIDC_ISSUER: !Ref OidcIssuer
          OIDC_AUDIENCE: !Ref OidcAudience

  # -------------------------------------------------------------------
  # ARCHIVE PATH — EventBridge -> Firehose -> S3
  # Το Firehose μαζεύει events σε batches: λύνει το small-files problem
  # που θα δημιουργούσε ένα PutObject ανά alert.
  # -------------------------------------------------------------------
  ArchiveRule:
    Type: AWS::Events::Rule
    Condition: ArchivePathEnabled
    Properties:
      EventBusName: !Ref TrafficBus
      Description: Κάθε έγκυρο alert πάει στο data lake
      EventPattern:
        source: [maps-traffic.ingest]
        detail-type: [traffic.alert.created]
      Targets:
        - Id: FirehoseTarget
          Arn: !GetAtt AlertsFirehose.Arn
          RoleArn: !GetAtt EventsToFirehoseRole.Arn
          DeadLetterConfig:
            Arn: !GetAtt ArchiveDlq.Arn      # ποτέ async target χωρίς DLQ

  ArchiveDlq:
    Type: AWS::SQS::Queue
    Condition: ArchivePathEnabled
    Properties:
      QueueName: !Sub 'maps-traffic-archive-dlq-${Environment}'
      MessageRetentionPeriod: 1209600        # 14 ημέρες, το μέγιστο
      SqsManagedSseEnabled: true

  AlertsFirehose:
    Type: AWS::KinesisFirehose::DeliveryStream
    Condition: ArchivePathEnabled
    Properties:
      DeliveryStreamName: !Sub 'maps-traffic-alerts-${Environment}'
      DeliveryStreamType: DirectPut
      ExtendedS3DestinationConfiguration:
        BucketARN: !GetAtt RawBucket.Arn
        RoleARN: !GetAtt FirehoseRole.Arn
        # Το partitioning πρέπει να ταιριάζει με το projection στο
        # sql/01-create-tables.sql, αλλιώς το Athena δεν βρίσκει τίποτα.
        Prefix: 'alerts/dt=!{timestamp:yyyy-MM-dd}/hh=!{timestamp:HH}/'
        ErrorOutputPrefix: 'errors/!{firehose:error-output-type}/dt=!{timestamp:yyyy-MM-dd}/'
        BufferingHints:
          IntervalInSeconds: 900             # 15′ — με λίγα events, ο χρόνος
          SizeInMBs: 128                     # γεμίζει πρώτος, όχι το μέγεθος
        CompressionFormat: GZIP
        CloudWatchLoggingOptions:
          Enabled: true
          LogGroupName: !Sub '/aws/kinesisfirehose/maps-traffic-${Environment}'
          LogStreamName: S3Delivery

  # -------------------------------------------------------------------
  # IAM — least privilege. Κάθε role βλέπει μόνο ό,τι χρειάζεται.
  # -------------------------------------------------------------------
  EventsToFirehoseRole:
    Type: AWS::IAM::Role
    Condition: ArchivePathEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: events.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PutToFirehose
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [firehose:PutRecord, firehose:PutRecordBatch]
                Resource: !GetAtt AlertsFirehose.Arn

  FirehoseRole:
    Type: AWS::IAM::Role
    Condition: ArchivePathEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: firehose.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteToRawBucket
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                  - s3:PutObject
                Resource:
                  - !GetAtt RawBucket.Arn
                  - !Sub '${RawBucket.Arn}/*'
              - Effect: Allow
                Action: [logs:PutLogEvents]
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/kinesisfirehose/*'

  # -------------------------------------------------------------------
  # MEDIA PATH — ΜΕΛΛΟΝΤΙΚΗ ΔΥΝΑΤΟΤΗΤΑ (EnableMediaPath)
  #
  # Δεν αντικαθιστά τίποτα: είναι ένας ακόμη παραγωγός alerts που
  # καταλήγει στην IngestFunction, ώστε validation και κανονικοποίηση να
  # μείνουν σε ένα μόνο σημείο. Καμία υπάρχουσα Lambda δεν αλλάζει.
  #
  # ΠΡΟΣΟΧΗ: η φωνητική αναζήτηση προορισμού της εφαρμογής ΔΕΝ περνά από
  # εδώ — γίνεται on-device από το Android. Εδώ έρχεται μόνο ηχογραφημένη
  # ΑΝΑΦΟΡΑ συμβάντος.
  # -------------------------------------------------------------------
  MediaBucket:
    Type: AWS::S3::Bucket
    Condition: MediaPathEnabled
    Properties:
      BucketName: !Sub 'maps-traffic-media-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
      LifecycleConfiguration:
        Rules:
          # Ηχητικά και φωτογραφίες δρόμου περιέχουν φωνές, πρόσωπα και
          # πινακίδες. Το χρήσιμο είναι το κείμενο που βγαίνει από αυτά —
          # το πρωτογενές υλικό δεν υπάρχει λόγος να μείνει.
          - Id: DeleteRawMedia
            Status: Enabled
            ExpirationInDays: 7
          - Id: CleanIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  # Το S3 καλεί τη Lambda ασύγχρονα: μετά τις retries το event χάνεται
  # οριστικά αν δεν υπάρχει DLQ — ίδιος κανόνας με το archive path.
  MediaDlq:
    Type: AWS::SQS::Queue
    Condition: MediaPathEnabled
    Properties:
      QueueName: !Sub 'maps-traffic-media-dlq-${Environment}'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  MediaFunction:
    Type: AWS::Serverless::Function
    Condition: MediaPathEnabled
    Properties:
      FunctionName: !Sub 'maps-traffic-media-${Environment}'
      Handler: media.handler
      CodeUri: ../src/media/
      Timeout: 30
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt MediaDlq.Arn
      Environment:
        Variables:
          # Σκόπιμα !Sub και όχι !Ref MediaBucket: το !Ref σε bucket που
          # δίνει και το S3 trigger κλείνει κύκλο εξαρτήσεων στο SAM.
          INGEST_FUNCTION_NAME: !Sub 'maps-traffic-ingest-${Environment}'
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub 'maps-traffic-media-${Environment}-${AWS::AccountId}'
        - LambdaInvokePolicy:
            FunctionName: !Sub 'maps-traffic-ingest-${Environment}'
        - Statement:
            - Effect: Allow
              Action: [rekognition:DetectLabels]
              Resource: '*'      # το DetectLabels δεν δέχεται resource ARN
            - Effect: Allow
              Action:
                - transcribe:StartTranscriptionJob
                - transcribe:GetTranscriptionJob
              Resource: '*'
            # Το Transcribe γράφει το αποτέλεσμα ως ο ΚΑΛΩΝ, όχι με δικό
            # του role: χωρίς PutObject το job αποτυγχάνει σιωπηλά.
            - Effect: Allow
              Action: [s3:PutObject]
              Resource: !Sub 'arn:aws:s3:::maps-traffic-media-${Environment}-${AWS::AccountId}/transcripts/*'
      Events:
        AudioUploaded:
          Type: S3
          Properties:
            Bucket: !Ref MediaBucket
            Events: 's3:ObjectCreated:*'
            Filter:
              S3Key:
                Rules: [{Name: prefix, Value: 'audio/'}]
        ImageUploaded:
          Type: S3
          Properties:
            Bucket: !Ref MediaBucket
            Events: 's3:ObjectCreated:*'
            Filter:
              S3Key:
                Rules: [{Name: prefix, Value: 'image/'}]
        TranscriptReady:
          Type: S3
          Properties:
            Bucket: !Ref MediaBucket
            Events: 's3:ObjectCreated:*'
            Filter:
              S3Key:
                Rules: [{Name: prefix, Value: 'transcripts/'}]

Outputs:
  ApiEndpoint:
    Description: Το URL που αντικαθιστά το Cloudflare Worker
    Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
  RawBucketName:
    Value: !Ref RawBucket
  EventBusName:
    Value: !Ref TrafficBus
  MediaBucketName:
    Condition: MediaPathEnabled
    Description: Ανέβασε σε audio/ ή image/ με x-amz-meta-lat & x-amz-meta-lon
    Value: !Ref MediaBucket
